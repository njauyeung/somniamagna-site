# Pages CMS editor setup (https://app.pagescms.org).
# This file tells the editor which boxes to show you. It edits content.json for you.
# Photos you upload go into the images/ folder and show up on the site after the next deploy.
media:
  input: images
  output: /images
content:
  - name: website
    label: Website text
    type: file
    path: content.json
    fields:
      - name: site
        label: Basics
        type: object
        fields:
          - { name: name, label: "Brand name", type: string }
          - { name: motto, label: "Line under the big name (Bringing dreams to life)", type: string }
          - { name: page_title, label: "Browser tab title", type: string }
          - { name: description, label: "Google / link preview description", type: text }
          - { name: email, label: "Contact email (every Get in touch button uses this)", type: string }
          - { name: instagram, label: "Instagram handle (no @)", type: string }
          - { name: city, label: "City", type: string }

      - name: events
        label: Events tab
        type: object
        fields:
          - { name: title, label: "Tab heading", type: string }
          - { name: lead, label: "Sentence under the heading", type: text }
          - { name: list_heading, label: "Small label above the list", type: string }
          - name: items
            label: Events (each one is a dot on the globe)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: "Event name (max 28 characters so it stays on one line)", type: string, options: { maxlength: 28 } }
              - { name: date, label: "Date. Type 2026-12-12 and it shows as Sat, Dec 12. Or write it yourself, e.g. Date to be announced", type: string }
              - { name: place, label: "City (e.g. Toronto). Common cities are placed on the globe automatically", type: string }
              - { name: lon, label: "Longitude (only if the city is not found on the globe)", type: number }
              - { name: lat, label: "Latitude (only if the city is not found on the globe)", type: number }
              - { name: blurb, label: "Short description (shows when the event is opened)", type: text }
              - name: photos
                label: Photos from this event (upload as many as you like)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{caption}"
                fields:
                  - { name: image, label: "Photo", type: image }
                  - { name: caption, label: "Caption (optional)", type: string }
              - { name: sample, label: "Still a placeholder? (turn OFF once it is real)", type: boolean }

      - name: partners
        label: Partnerships tab
        type: object
        fields:
          - { name: title, label: "Tab heading", type: string }
          - { name: lead, label: "Sentence under the heading", type: text }
          - { name: list_heading, label: "Small label above the list", type: string }
          - name: items
            label: Partners (each one is a dot on the globe)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - { name: name, label: "Partner name (max 28 characters)", type: string, options: { maxlength: 28 } }
              - { name: type, label: "Type (Sponsor, Venue, Creator...)", type: string }
              - { name: place, label: "City", type: string }
              - { name: lon, label: "Longitude (only if the city is not found)", type: number }
              - { name: lat, label: "Latitude (only if the city is not found)", type: number }
              - { name: sample, label: "Still a placeholder? (turn OFF once it is real)", type: boolean }
          - { name: work_heading, label: "Label above the pitch", type: string }
          - { name: body, label: "Pitch paragraph", type: text }
          - { name: button, label: "Button text", type: string }

      - name: community
        label: Community tab
        type: object
        fields:
          - { name: title, label: "Tab heading", type: string }
          - { name: lead, label: "Sentence under the heading", type: text }
          - { name: list_heading, label: "Small label above the places", type: string }
          - name: items
            label: Shared places and photos (each one is a dot on the globe)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - { name: image, label: "Photo", type: image }
              - { name: caption, label: "Caption (max 28 characters)", type: string, options: { maxlength: 28 } }
              - { name: place, label: "City", type: string }
              - { name: lon, label: "Longitude (only if the city is not found)", type: number }
              - { name: lat, label: "Latitude (only if the city is not found)", type: number }
              - { name: sample, label: "Still a placeholder? (turn OFF once it is real)", type: boolean }
          - { name: gallery_heading, label: "Label above the event photo grid", type: string }
          - { name: stories_heading, label: "Label above the stories", type: string }
          - name: stories
            label: Community stories
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - { name: quote, label: "What they said", type: text }
              - { name: name, label: "Name", type: string }
              - { name: sample, label: "Still a placeholder? (turn OFF once it is real)", type: boolean }
          - { name: share_heading, label: "Label above the share-your-photos box", type: string }
          - { name: share_body, label: "Share-your-photos sentence", type: text }
          - { name: share_button, label: "Share-your-photos button", type: string }

      - name: about
        label: About tab
        type: object
        fields:
          - { name: heading, label: "Tab heading", type: string }
          - { name: body, label: "Paragraph", type: text }
          - { name: list_heading, label: "Label above the Toronto dot", type: string }
          - { name: origin_label, label: "Name of the Toronto dot", type: string }
          - { name: origin_place, label: "Its city", type: string }
          - { name: pillars_heading, label: "Label above the Events / Partnerships / Community blurbs", type: string }
          - name: pillars
            label: What we do (one blurb each for Events, Partnerships, Community)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Title, type: string }
              - { name: body, label: Blurb, type: text }
          - { name: principles_heading, label: "Label above the values", type: string }
          - { name: button, label: "Button text", type: string }
      - name: principles
        label: What we stand for
        type: object
        fields:
          - { name: kicker, label: "Small label", type: string }
          - name: items
            label: Values
            type: object
            list: true
            fields:
              - { name: title, label: "Title", type: string }
              - { name: body, label: "Sentence", type: text }
      - name: contact
        label: The name
        type: object
        fields:
          - { name: quote, label: "Name in Latin", type: string }
          - { name: meaning, label: "Meaning", type: string }
