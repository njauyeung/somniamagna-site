<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Somnia Magna · Add a post</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--card:#EEEAF7;--ink:#0A0B1F;--cream:#F3EFDF;--violet:#4B3E9C;--soft:#262851;--muted:#4B4B6B}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--cream);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px}
header img{height:24px;display:block}
header a{color:var(--cream);font-size:14px;font-weight:600;text-decoration:none;padding:10px 16px;border-radius:20px;background:rgba(243,239,223,.12)}
main{max-width:640px;margin:0 auto;padding:0 20px 80px}
.card{background:var(--card);color:var(--ink);border-radius:28px;padding:24px;margin-bottom:20px}
h1{margin:0 0 4px;font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{margin:0 0 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);font-weight:600}
.who{margin:0 0 18px;font-size:13px;color:var(--muted)}
label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600}
label small{font-weight:500;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea{width:100%;border:0;border-radius:14px;background:#fff;padding:13px 14px;font:inherit;font-size:15px;color:var(--ink);outline:none}
input:focus,textarea:focus{box-shadow:0 0 0 2px var(--violet)}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{margin-top:12px;font-size:13px;color:var(--muted)}
summary{cursor:pointer;font-weight:600}
.drop{display:flex;align-items:center;justify-content:center;margin-top:6px;min-height:92px;border:2px dashed rgba(75,62,156,.4);border-radius:18px;background:rgba(255,255,255,.5);font-size:14px;font-weight:600;color:var(--violet);cursor:pointer;text-align:center;padding:12px}
.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:12px}
.th{position:relative;background:#fff;border-radius:14px;overflow:hidden}
.th img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.th input{width:100%;border:0;padding:8px 10px;font:inherit;font-size:12px;outline:none;background:#fff}
.th button{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(10,11,31,.7);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 26px;border:0;border-radius:24px;background:var(--ink);color:var(--cream);font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:22px}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:14px;font-size:14px;font-weight:600}
.msg.err{color:#B3261E}.msg.ok{color:#1B6B45}
.post{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.post img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#ddd;flex:none}
.post div{flex:1;min-width:0}
.post b,.post span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post b{font-size:14px}.post span{font-size:12px;color:var(--muted)}
.trash{flex:none;height:36px;padding:0 12px;border:0;border-radius:18px;background:#F6DAD8;color:#8C1D18;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.trash.sure{background:#B3261E;color:#fff}
.empty{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <img src="../images/brand/soma-wordmark-white.png" alt="SOMA">
  <a href="../">View site</a>
</header>
<main>
  <section class="card">
    <h1>Add a post</h1>
    <p class="who" id="who">Checking sign-in…</p>
    <form id="f" autocomplete="off">
      <label for="title">Title <small>(28 characters max, so it fits on one line)</small></label>
      <input id="title" type="text" maxlength="28" required placeholder="Sunset session">
      <div class="two">
        <div><label for="place">City</label><input id="place" type="text" list="cities" required placeholder="Toronto"></div>
        <div><label for="date">Date</label><input id="date" type="date"></div>
      </div>
      <datalist id="cities"></datalist>
      <details id="coords"><summary>City not in the list? Enter coordinates</summary>
        <div class="two"><div><label for="lon">Longitude</label><input id="lon" type="number" step="any" placeholder="-79.38"></div><div><label for="lat">Latitude</label><input id="lat" type="number" step="any" placeholder="43.65"></div></div>
      </details>
      <label for="body">How did it go?</label>
      <textarea id="body" maxlength="4000" placeholder="What happened, who came, what you'd do again."></textarea>
      <label>Photos <small>(up to 12; resized on your device, location data removed)</small></label>
      <label class="drop" for="files"><span>Tap to choose photos</span><input id="files" type="file" accept="image/*" multiple></label>
      <div class="thumbs" id="thumbs"></div>
      <button class="btn" id="go" type="submit">Publish</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </section>
  <section class="card">
    <h2>Your posts</h2>
    <div id="posts"><p class="empty">Loading…</p></div>
  </section>
</main>
<script src="../cities.js"></script>
<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var H = { 'X-Requested-With': 'sm' };
var picked = [];   // { blob, url, caption }

try { localStorage.setItem('sm_owner', '1'); } catch (e) {}   // lets the main site show the trash button

smCityNames().forEach(function (n) { var o = document.createElement('option'); o.value = n; $('#cities').appendChild(o); });

fetch('../api/admin/me', { credentials: 'same-origin' }).then(function (r) { return r.json(); })
  .then(function (j) { $('#who').textContent = 'Signed in as ' + j.email; })
  .catch(function () { $('#who').textContent = 'Not signed in. Reload the page.'; });

/* resize on the device: max 2000px, re-saved as JPEG (this also drops EXIF/GPS) */
function shrink(file) {
  return createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (bm) {
    var s = Math.min(1, 2000 / Math.max(bm.width, bm.height)), w = Math.round(bm.width * s), h = Math.round(bm.height * s);
    var c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(bm, 0, 0, w, h);
    return new Promise(function (res, rej) { c.toBlob(function (b) { b ? res(b) : rej(new Error('Could not read that photo.')); }, 'image/jpeg', 0.86); });
  });
}
function drawThumbs() {
  $('#thumbs').innerHTML = picked.map(function (p, i) {
    return '<div class="th"><img src="' + p.url + '" alt=""><button type="button" data-rm="' + i + '" aria-label="Remove">×</button><input type="text" maxlength="120" data-cap="' + i + '" placeholder="Caption (optional)" value="' + esc(p.caption) + '"></div>';
  }).join('');
}
$('#files').addEventListener('change', function (e) {
  var list = Array.prototype.slice.call(e.target.files); e.target.value = '';
  $('#msg').textContent = list.length ? 'Preparing photos…' : ''; $('#msg').className = 'msg';
  list.reduce(function (p, f) {
    return p.then(function () {
      if (picked.length >= 12) return;
      return shrink(f).then(function (b) { picked.push({ blob: b, url: URL.createObjectURL(b), caption: '' }); });
    }).catch(function (err) { $('#msg').textContent = err.message; $('#msg').className = 'msg err'; });
  }, Promise.resolve()).then(function () { drawThumbs(); if ($('#msg').className.indexOf('err') < 0) $('#msg').textContent = ''; });
});
$('#thumbs').addEventListener('click', function (e) { var b = e.target.closest('[data-rm]'); if (b) { URL.revokeObjectURL(picked[+b.dataset.rm].url); picked.splice(+b.dataset.rm, 1); drawThumbs(); } });
$('#thumbs').addEventListener('input', function (e) { if (e.target.dataset.cap != null) picked[+e.target.dataset.cap].caption = e.target.value; });

function coordsFor() {
  var lon = parseFloat($('#lon').value), lat = parseFloat($('#lat').value);
  if (isFinite(lon) && isFinite(lat)) return [lon, lat];
  return smCity($('#place').value);
}
$('#f').addEventListener('submit', function (e) {
  e.preventDefault();
  var m = $('#msg'), c = coordsFor();
  m.className = 'msg';
  if (!c) { m.textContent = 'That city isn\'t in the list. Open "City not in the list?" and enter its coordinates.'; m.className = 'msg err'; $('#coords').open = true; return; }
  var fd = new FormData();
  fd.append('title', $('#title').value); fd.append('place', $('#place').value); fd.append('date', $('#date').value);
  fd.append('lon', c[0]); fd.append('lat', c[1]); fd.append('body', $('#body').value);
  picked.forEach(function (p, i) { fd.append('photos', p.blob, 'photo' + i + '.jpg'); fd.append('caption_' + i, p.caption); });
  $('#go').disabled = true; m.textContent = 'Publishing…';
  fetch('../api/admin/posts', { method: 'POST', headers: H, body: fd, credentials: 'same-origin' })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Could not publish.'); return j; }); })
    .then(function () {
      $('#f').reset(); picked.forEach(function (p) { URL.revokeObjectURL(p.url); }); picked = []; drawThumbs();
      m.textContent = 'Published. It is live in the Community tab.'; m.className = 'msg ok'; loadPosts();
    })
    .catch(function (err) { m.textContent = err.message; m.className = 'msg err'; })
    .then(function () { $('#go').disabled = false; });
});

function loadPosts() {
  fetch('../api/posts', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    var el = $('#posts');
    if (!j.posts.length) { el.innerHTML = '<p class="empty">Nothing yet. Your first post will show up here.</p>'; return; }
    el.innerHTML = j.posts.map(function (p) {
      var im = p.photos[0] ? '<img src="../' + esc(p.photos[0].url.replace(/^\//, '')) + '" alt="">' : '<img alt="">';
      return '<div class="post">' + im + '<div><b>' + esc(p.title) + '</b><span>' + esc(p.place) + (p.event_date ? ' · ' + esc(p.event_date) : '') + ' · ' + p.photos.length + ' photo' + (p.photos.length === 1 ? '' : 's') + '</span></div><button class="trash" type="button" data-del="' + esc(p.id) + '">Delete</button></div>';
    }).join('');
  }).catch(function () { $('#posts').innerHTML = '<p class="empty">Could not load posts.</p>'; });
}
$('#posts').addEventListener('click', function (e) {
  var b = e.target.closest('[data-del]'); if (!b) return;
  if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'Tap again to delete'; setTimeout(function () { b.classList.remove('sure'); b.textContent = 'Delete'; }, 4000); return; }
  b.disabled = true;
  fetch('../api/admin/posts/' + b.dataset.del, { method: 'DELETE', headers: H, credentials: 'same-origin' }).then(loadPosts);
});
loadPosts();
})();
</script>
</body>
</html>
