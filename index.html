<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somnia Magna | Bringing dreams to life</title>
<meta name="description" content="Curated day and night experiences in Toronto, built around people and community instead of the bar.">
<meta property="og:title" content="Somnia Magna | Bringing dreams to life">
<meta property="og:description" content="Curated day and night experiences in Toronto, built around people and community.">
<meta property="og:image" content="og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0A0B1F">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;1,500;1,600;1,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#0A0B1F;color:#F3EFDF;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block}
h1,h2,h3,p,ol{margin:0}
ol{padding:0;list-style:none}
.disp{font-family:'Kanit',sans-serif;font-style:italic;text-transform:uppercase}
.pad{padding-left:clamp(24px,5vw,72px);padding-right:clamp(24px,5vw,72px)}
.wrap{max-width:1296px;margin:0 auto}
.kick{font-family:'Kanit',sans-serif;font-style:italic;font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;min-height:56px;padding:0 40px;font-weight:600;font-size:15px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.btn.light{background:#F3EFDF;color:#0A0B1F}
.btn.dark{background:rgba(10,11,31,.72);color:#F3EFDF}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,a:focus-visible{outline:2px solid #7AF3C2;outline-offset:3px}

/* header + hero */
.hero{position:relative;min-height:880px;overflow:hidden;background:linear-gradient(180deg,#0A0B1F 0%,#1B1F4A 40%,#6C5BB8 72%,#E7A9A0 100%)}
.scene{position:absolute;top:0;right:0;width:min(66%,960px);height:100%;clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);background:#1B1F4A}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 60%}
.scene i{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,31,.55) 0%,rgba(10,11,31,0) 38%)}
header.top{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:center}
header.top{position:absolute;top:0;left:0;right:0;z-index:5;padding-top:24px;padding-bottom:24px;color:#0A0B1F}
.logo,nav a{color:#0A0B1F}
nav a{opacity:.85}nav a:hover{opacity:1}
nav{position:absolute;left:50%;transform:translateX(-50%)}
.tools{display:flex;gap:10px;align-items:center}
.ibtn{position:relative;width:42px;height:42px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);color:#0A0B1F;cursor:pointer;overflow:hidden;font:600 13px 'DM Sans',sans-serif}
.ibtn svg{width:20px;height:20px}
.ibtn:hover{background:#fff}
.who{border:2px solid #fff;background:#4B3E9C;color:#F3EFDF}
.who img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:280px;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(238,234,247,.95) 0%,rgba(238,234,247,.6) 90px,rgba(238,234,247,0) 280px)}
.sx{position:fixed;inset:0;z-index:50;background:rgba(10,11,31,.82);backdrop-filter:blur(6px);display:none;padding:12vh 24px 24px}
.sx.on{display:block}
.sx-box{max-width:640px;margin:0 auto}
.sx-in{width:100%;height:60px;border-radius:30px;border:0;padding:0 28px;font:500 18px 'DM Sans',sans-serif;background:#F3EFDF;color:#0A0B1F}
.sx-in:focus-visible{outline:2px solid #7AF3C2;outline-offset:3px}
.sx-res{margin-top:16px;display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto}
.sx-res a{display:block;padding:14px 20px;border-radius:18px;background:#1B1F4A}
.sx-res a:hover,.sx-res a:focus-visible{background:#2a2f6b;outline:none}
.sx-res b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7AF3C2;font-weight:600}
.sx-res span{display:block;margin-top:4px;font-size:15px;line-height:1.5;color:#F3EFDF}
.sx-res mark{background:none;color:#7AF3C2;font-weight:600}
.sx-none{padding:14px 20px;color:#C9C6E3}

.logo{font-weight:700;font-size:26px;letter-spacing:.12em}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px 32px;font-size:14px;font-weight:500}
nav a.cta-x{display:inline-flex;align-items:center;min-height:44px;padding:0 24px;background:#F3EFDF;color:#0A0B1F;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);font-weight:600}
.hero-in{position:relative;z-index:2;max-width:1440px;margin:0 auto;padding-top:168px}
.hero-in .box{max-width:min(640px,100%)}
.tag{display:inline-block;padding:8px 18px;background:rgba(10,11,31,.55);font-size:13px;font-weight:500;letter-spacing:.08em;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
h1.name{margin-top:28px;font-weight:700;font-size:clamp(52px,8vw,120px);line-height:.92;letter-spacing:-.01em}
.motto{margin-top:24px;font-weight:500;font-size:clamp(18px,1.8vw,24px);letter-spacing:.14em}
.sub{margin-top:24px;font-size:18px;line-height:1.6;max-width:34ch}
.btns{margin-top:40px;display:flex;flex-wrap:wrap;gap:16px}

/* light sections */
.light-sec{color:#0A0B1F;padding-top:120px;padding-bottom:120px}
#about{background:#EEEAF7}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:64px 80px;align-items:center}
.about-grid .kick{color:#4B3E9C}
.about-grid h2{margin-top:20px;font-weight:700;font-size:clamp(40px,5.4vw,76px);line-height:1}
.about-grid p{margin-top:32px;font-size:18px;line-height:1.75;max-width:50ch;color:#262851}
.about-img{position:relative;height:480px;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);background:#1B1F4A}
.about-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 60%}

/* what we do */
#do{padding-top:120px;padding-bottom:120px}
#do h2.big,#events h2.big{font-weight:700;font-size:clamp(40px,5vw,72px);line-height:1}
.cards{margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px}
.card{padding:44px 36px 48px;background:#1B1F4A;clip-path:polygon(0 0,100% 0,100% calc(100% - 36px),calc(100% - 36px) 100%,0 100%)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start}
.card .ic{width:48px;height:48px;color:#7AF3C2}
.card .ic svg{width:48px;height:48px}
.card .n{font-size:13px;letter-spacing:.2em;color:rgba(243,239,223,.7)}
.card .w{margin-top:28px;font-family:'Kanit',sans-serif;font-style:italic;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#B9A6FF}
.card h3{margin-top:8px;font-family:'Kanit',sans-serif;font-style:italic;font-weight:700;font-size:36px;text-transform:uppercase}
.card p{margin-top:16px;font-size:16px;line-height:1.7;color:rgba(243,239,223,.88)}

/* stand for */
#stand{background:#DAD6E6;color:#0A0B1F;padding-top:120px;padding-bottom:120px}
.stand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:56px 80px}
.stand-grid .kick{color:#4B3E9C}
.stand-grid h2{margin-top:20px;font-weight:700;font-size:clamp(40px,5vw,68px);line-height:1}
.principles{display:flex;flex-direction:column;gap:20px}
.pr{display:flex;gap:24px;align-items:flex-start;padding:28px;background:#F3EFDF;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 100%,0 100%)}
.pr .num{font-family:'Kanit',sans-serif;font-style:italic;font-weight:700;font-size:40px;line-height:1;color:#4B3E9C}
.pr h3{font-family:'Kanit',sans-serif;font-style:italic;font-weight:600;font-size:24px;text-transform:uppercase}
.pr p{margin-top:8px;font-size:16px;line-height:1.6;color:#262851}

/* events */
#events{background:linear-gradient(135deg,#1B1F4A 0%,#4B3E9C 60%,#B9A6FF 130%);padding-top:120px;padding-bottom:120px}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:48px 80px;align-items:center}
.ev-grid .kick{color:#7AF3C2}
.ev-grid h2{margin-top:20px;font-weight:700;font-size:clamp(48px,7vw,104px);line-height:.95}
.events{display:flex;flex-direction:column;gap:24px}
.ev{padding:44px;background:#0A0B1F;clip-path:polygon(0 0,100% 0,100% calc(100% - 40px),calc(100% - 40px) 100%,0 100%)}
.ev .pl{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#7AF3C2}
.ev h3{margin-top:12px;font-family:'Kanit',sans-serif;font-style:italic;font-weight:700;font-size:40px;text-transform:uppercase;line-height:1.05}
.ev .d{margin-top:20px;font-size:17px;font-weight:500}
.ev p{margin-top:16px;font-size:16px;line-height:1.7;color:rgba(243,239,223,.85)}
.ev a.go{display:inline-flex;margin-top:24px;align-items:center;min-height:48px;padding:0 28px;background:#F3EFDF;color:#0A0B1F;font-weight:600;font-size:14px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.ev a.go:not([href]){display:none}

/* partner */
#partner{background:#F3EFDF;color:#0A0B1F;padding-top:120px;padding-bottom:120px}
.partner-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:56px 80px;align-items:center}
.partner-grid .kick{color:#4B3E9C}
.partner-grid h2{margin-top:20px;font-weight:700;font-size:clamp(44px,6vw,88px);line-height:.98}
.partner-grid p{margin-top:28px;font-size:18px;line-height:1.75;max-width:48ch;color:#262851}
.partner-grid .btn{margin-top:36px;background:#0A0B1F;color:#F3EFDF}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:16px}
.chip{padding:56px 24px 28px;color:#F3EFDF;font-family:'Kanit',sans-serif;font-style:italic;font-weight:600;font-size:24px;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,0 100%);background:#0A0B1F}
.chip:nth-child(3n+2){background:#1B1F4A}
.chip:nth-child(3n){background:#4B3E9C}

/* contact */
#contact{position:relative;overflow:hidden;background:#0A0B1F;padding-top:140px;padding-bottom:48px}
#contact>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%}
#contact .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,31,.85) 0%,rgba(10,11,31,.35) 55%,rgba(10,11,31,.7) 100%)}
#contact .in{position:relative}
#contact .q{font-size:14px;letter-spacing:.1em;text-transform:uppercase}
#contact h2{margin-top:20px;font-weight:700;font-size:clamp(52px,9vw,136px);line-height:.93}
#contact .body{margin-top:28px;font-size:19px;line-height:1.6;max-width:40ch}
#contact .btn{margin-top:36px;background:#F3EFDF;color:#0A0B1F}
.foot{margin-top:120px;padding-top:24px;border-top:1px solid rgba(243,239,223,.35);display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;font-size:14px;font-weight:500}


/* explorer */
.xp{--pw:400px;position:relative;margin-top:56px;height:760px;border-radius:36px;overflow:hidden;background:#0F1A45}
.xp[data-state=wide]{--pw:min(780px,72%)}
.xp[data-state=closed]{--pw:0px}
.xp-map{position:absolute;inset:0;overflow:hidden}
.xp-map>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.xp-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,31,.5),rgba(10,11,31,0) 28%,rgba(10,11,31,.4))}
.xp-route{position:absolute;inset:0;width:100%;height:100%}
.xp-bar{position:absolute;top:20px;left:20px;right:20px;display:flex;gap:10px;align-items:center;z-index:6}
.xp-search{position:relative;flex:1;max-width:420px;height:48px;border-radius:24px;background:rgba(243,239,223,.92);color:#0A0B1F;display:flex;align-items:center;gap:10px;padding:0 18px}
.xp-search svg{width:20px;height:20px;flex:none}
.xp-search input{flex:1;min-width:0;border:0;background:none;font:500 14px 'DM Sans',sans-serif;color:#0A0B1F;outline:none}
.xp-search:focus-within{box-shadow:0 0 0 2px #7AF3C2}
.xp-sug{display:none;position:absolute;top:56px;left:0;right:0;border-radius:20px;background:#0A0B1F;color:#F3EFDF;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.4);max-height:300px;overflow:auto}
.xp-sug.on,.xp-pop.on{display:block}
.xp-sug button,.xp-pop a{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;padding:10px 12px;border-radius:12px;font:500 14px 'DM Sans',sans-serif;cursor:pointer}
.xp-sug button:hover,.xp-sug button:focus-visible,.xp-pop a:hover{background:#1B1F4A;outline:none}
.xp-sug small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7AF3C2;font-weight:600}
.xp-bellw{position:relative;margin-left:auto}
.xp-ic{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:rgba(243,239,223,.92);color:#0A0B1F;display:flex;align-items:center;justify-content:center;cursor:pointer}
.xp-ic svg{width:22px;height:22px}
.xp-dot{position:absolute;top:11px;right:12px;width:9px;height:9px;border-radius:50%;background:#E5484D;border:2px solid #F3EFDF;box-sizing:content-box}
.xp-pop{display:none;position:absolute;top:56px;right:0;width:260px;border-radius:20px;background:#0A0B1F;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.4);font-size:14px}
.xp-pop b{display:block;padding:0 12px 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7AF3C2}
.xp-user{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 6px;border-radius:24px;background:rgba(243,239,223,.92);color:#0A0B1F;transition:margin .35s}
.xp[data-state=half] .xp-user,.xp[data-state=wide] .xp-user{margin-right:var(--pw)}
.xp-av{position:relative;width:36px;height:36px;border-radius:50%;background:#4B3E9C;color:#F3EFDF;display:flex;align-items:center;justify-content:center;font:600 12px 'DM Sans',sans-serif;overflow:hidden;flex:none}
.xp-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.xp-un b{display:block;font-size:13px;line-height:1.1}.xp-un em{display:block;font-style:normal;font-size:11px;color:#4B4B6B}
.xp-lbl{position:absolute;left:20px;bottom:20px;z-index:3;padding:8px 16px;border-radius:20px;background:rgba(10,11,31,.58);font-size:13px;font-weight:500;letter-spacing:.08em}
.xp-pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;z-index:3;cursor:pointer}
.xp-pin i{position:absolute;inset:6px;border-radius:50%;background:#0A0B1F;color:#F3EFDF;border:2px solid #F3EFDF;display:flex;align-items:center;justify-content:center;font:600 15px 'DM Sans',sans-serif;font-style:normal;transition:transform .2s}
.xp-pin:hover i{transform:scale(1.12)}
.xp-pin span{color:#F3EFDF;position:absolute;left:50px;top:10px;padding:4px 12px;border-radius:14px;background:rgba(10,11,31,.7);font-size:12px;font-weight:600;white-space:nowrap}
.xp-pin[aria-selected=true] i{background:#7AF3C2;color:#0A0B1F}
.xp-pin[aria-selected=true]::before{content:"";position:absolute;inset:0;border-radius:50%;background:#7AF3C2;animation:xpp 2.4s ease-out infinite}
@keyframes xpp{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.xp-pin:focus-visible,.xp-tab:focus-visible,.xp-handle:focus-visible,.xp-ic:focus-visible{outline:2px solid #7AF3C2;outline-offset:3px}
.xp-panel{position:absolute;z-index:5;top:84px;right:16px;bottom:16px;width:var(--pw);transition:width .4s cubic-bezier(.3,.7,.2,1)}
.xp-in{height:100%;overflow:hidden;border-radius:28px;background:#EEEAF7;color:#0A0B1F;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.xp[data-state=closed] .xp-in{box-shadow:none}
.xp-handle{position:absolute;z-index:7;left:-22px;top:70%;width:44px;height:44px;border-radius:50%;border:3px solid #EEEAF7;background:#0A0B1F;color:#F3EFDF;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.xp-handle svg{width:20px;height:20px;transition:transform .3s}
.xp[data-state=wide] .xp-handle svg{transform:rotate(180deg)}
.xp[data-state=closed] .xp-handle{left:-44px}
.xp-stats{display:flex;gap:8px;padding:20px 24px 0;flex-wrap:wrap}
.xp-stat{flex:1;min-width:96px;padding:12px 14px;border-radius:16px;background:#fff}
.xp-stat b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#4B3E9C}
.xp-stat span{display:block;margin-top:4px;font-size:14px;font-weight:600}
.xp-tabs{display:flex;gap:6px;padding:16px 24px 0;flex-wrap:wrap}
.xp-tab{height:38px;padding:0 16px;border-radius:19px;border:0;background:#E1DCF1;color:#0A0B1F;font:600 13px 'DM Sans',sans-serif;cursor:pointer}
.xp-tab[aria-selected=true]{background:#0A0B1F;color:#F3EFDF}
.xp-body{flex:1;overflow-y:auto;padding:18px 24px 28px;min-width:300px}
.xp-body h3{font-family:'Kanit',sans-serif;font-style:italic;text-transform:uppercase;font-weight:700;font-size:32px;line-height:1}
.xp-body .lead{margin-top:12px;font-size:15px;line-height:1.65;color:#262851}
.xp-body h4{margin:24px 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#4B3E9C}
.xp-item{padding:16px 18px;border-radius:18px;background:#fff;margin-bottom:10px;scroll-margin:12px}
.xp-item.hit{box-shadow:0 0 0 2px #7AF3C2}
.xp-item b{display:block;font-size:16px}
.xp-item em{display:block;margin-top:2px;font-style:normal;font-size:12px;color:#4B3E9C;font-weight:600}
.xp-item p{margin-top:8px;font-size:14px;line-height:1.55;color:#262851}
.xp-tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;background:#FFE9A8;color:#5A4300;font-size:10px;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle;font-weight:600}
.xp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.xp-logo{padding:18px 12px;border-radius:18px;background:#fff;text-align:center;scroll-margin:12px}
.xp-logo svg{width:44px;height:44px;color:#4B3E9C}
.xp-logo b{display:block;margin-top:8px;font-size:13px}.xp-logo em{display:block;font-style:normal;font-size:11px;color:#4B4B6B}
.xp-quote p{font-size:16px;line-height:1.55;font-style:italic}
@media (max-width:900px){
  .xp{height:auto;display:flex;flex-direction:column;border-radius:28px}
  .xp-map{position:relative;height:420px;flex:none}
  .xp-panel{position:relative;top:auto;right:auto;bottom:auto;width:auto;margin:-24px 12px 12px}
  .xp[data-state=closed] .xp-panel{display:block}
  .xp-handle{display:none}.xp-in{min-height:420px}
  .xp-user{margin-right:0!important}.xp-un{display:none}.xp-user{padding:0 6px}
  .xp-pin span{display:none}
}
@media (max-width:820px){
  nav{position:static;transform:none;order:3;width:100%;gap:8px 20px}
  .scene{width:100%;clip-path:none;opacity:.5}
  .scene i{background:linear-gradient(180deg,rgba(10,11,31,.55),rgba(10,11,31,.15))}
  nav a:not(.cta){display:none}
  .hero{min-height:760px}
  .hero-in{padding-top:150px}
  .about-img{height:340px}
  .card,.ev{padding:32px 24px 40px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

    var pts=POS.map(function(q){return [q[0]*10,q[1]*6.8];}),d='M'+pts[0][0]+' '+pts[0][1];
    for(var k=1;k<pts.length;k++){var a=pts[k-1],b2=pts[k],mx=(a[0]+b2[0])/2;d+=' C'+mx+' '+a[1]+','+mx+' '+b2[1]+','+b2[0]+' '+b2[1];}
    $('xp-route').firstElementChild.setAttribute('d',d);
    var ev=(c.events&&c.events.items&&c.events.items[0])||{};
    $('xp-stats').innerHTML=[['Where',(c.site||{}).city||'Toronto'],['When','Day & night'],['Next',ev.date||'To be announced']].map(function(x){return '<div class="xp-stat"><b>'+E(x[0])+'</b><span>'+E(x[1])+'</span></div>';}).join('');
    $('xp-note').textContent=(ev.title||'Next gathering')+': '+(ev.date||'date to be announced');
    var em=document.querySelector('.xp-un em'); if(em&&(c.site||{}).email) em.textContent=c.site.email;
    built=true; pick(Math.min(sel,V.length-1),false);
  }
  function pick(i,open,k){
    var V=window.__xpv; sel=i;
    [].forEach.call($('xp-tabs').children,function(n,j){n.setAttribute('aria-selected',j===i);});
    [].forEach.call($('xp-pins').children,function(n,j){n.setAttribute('aria-selected',j===i);});
    var body=$('xp-body'); body.innerHTML=V[i].html(); body.scrollTop=0;
    if(open&&$('xp').getAttribute('data-state')==='closed') setState('half');
    if(k){var el=body.querySelector('[data-k="'+k+'"]');if(el){el.classList.add('hit');el.scrollIntoView({block:'center',behavior:'smooth'});}}
  }
  $('xp-handle').onclick=function(){var cur=$('xp').getAttribute('data-state'),n=cur==='half'?'wide':cur==='wide'?'closed':'half';setState(n);};
  var q=$('xp-q'),sug=$('xp-sug');
  function suggest(){
    var t=q.value.trim().toLowerCase(),V=window.__xpv||[],rows=[];
    V.forEach(function(v,i){
      if(!t) rows.push({i:i,k:'',t:v.name,g:'Go to'});
      else{ if(v.name.toLowerCase().indexOf(t)>-1) rows.push({i:i,k:'',t:v.name,g:'Section'});
        v.items().forEach(function(x){if(((x.t||'')+' '+(x.s||'')).toLowerCase().indexOf(t)>-1) rows.push({i:i,k:x.k,t:x.t||'',g:v.name});});}
    });
    sug.innerHTML=rows.slice(0,8).map(function(r,n){return '<button type="button" data-n="'+n+'"><small>'+E(r.g)+'</small>'+E(r.t)+'</button>';}).join('')||'<button type="button" disabled>Nothing found</button>';
    sug.classList.add('on'); sug._rows=rows;
  }
  q.addEventListener('focus',suggest); q.addEventListener('input',suggest);
  sug.addEventListener('click',function(e){var b=e.target.closest('button[data-n]');if(!b)return;var r=sug._rows[+b.getAttribute('data-n')];sug.classList.remove('on');q.blur();pick(r.i,true,r.k);});
  $('xp-bell').onclick=function(e){e.stopPropagation();$('xp-pop').classList.toggle('on');var d=document.querySelector('.xp-dot');if(d)d.style.display='none';};
  $('xp-note').onclick=function(e){e.preventDefault();$('xp-pop').classList.remove('on');pick(0,true);};
  document.addEventListener('click',function(e){if(!e.target.closest('.xp-search'))sug.classList.remove('on');if(!e.target.closest('.xp-bellw'))$('xp-pop').classList.remove('on');});
  document.addEventListener('sm:rendered',function(){build(window.SM_CONTENT);});
  if(window.SM_CONTENT&&!built) build(window.SM_CONTENT);
})();
</script>
<div class="sx" id="sx" role="dialog" aria-modal="true" aria-label="Search"><div class="sx-box"><input class="sx-in" id="sx-in" type="search" placeholder="Search Somnia Magna" autocomplete="off"><div class="sx-res" id="sx-res"></div></div></div>
<script>/* Site search: indexes the visible text of each section. */
(function(){
  var ov=document.getElementById('sx'), inp=document.getElementById('sx-in'), out=document.getElementById('sx-res'), idx=[];
  function label(sec){var h=sec.querySelector('h2'),k=sec.querySelector('.kick');return (h&&h.textContent.trim())||(k&&k.textContent.trim())||sec.id;}
  function build(){
    idx=[];
    [].forEach.call(document.querySelectorAll('main section, body > section, .hero'),function(sec){
      if(!sec.id) return; var name=label(sec), seen={};
      [].forEach.call(sec.querySelectorAll('h1,h2,h3,p,.chip,.xp-tab,.motto,.xp-nt,.xp-nd'),function(el){
        var t=el.textContent.replace(/\s+/g,' ').trim(); if(t.length<3||seen[t]) return; seen[t]=1;
        idx.push({id:sec.id,name:name,text:t});
      });
    });
  }
  function esc(x){return x.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function run(){
    var q=inp.value.trim().toLowerCase(); out.innerHTML=''; if(!q) return;
    var hits=idx.filter(function(r){return r.text.toLowerCase().indexOf(q)>-1;}).slice(0,8);
    if(!hits.length){out.innerHTML='<div class="sx-none">Nothing found for "'+esc(q)+'".</div>';return;}
    hits.forEach(function(r){
      var i=r.text.toLowerCase().indexOf(q), a=document.createElement('a'); a.href='#'+r.id;
      a.innerHTML='<b>'+esc(r.name)+'</b><span>'+esc(r.text.slice(0,i))+'<mark>'+esc(r.text.slice(i,i+q.length))+'</mark>'+esc(r.text.slice(i+q.length,i+160))+'</span>';
      a.addEventListener('click',close); out.appendChild(a);
    });
  }
  function open(){build();ov.classList.add('on');inp.value='';out.innerHTML='';setTimeout(function(){inp.focus();},30);}
  function close(){ov.classList.remove('on');}
  document.getElementById('s-open').addEventListener('click',open);
  inp.addEventListener('input',run);
  ov.addEventListener('click',function(e){if(e.target===ov)close();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') close();
    if(e.key==='/'&&!ov.classList.contains('on')&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();open();}
  });
})();
</script>
