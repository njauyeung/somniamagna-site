<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somnia Magna | Bringing dreams to life</title>
<meta name="description" content="Curated day and night experiences in Toronto, built around people and community instead of the bar.">
<meta property="og:title" content="Somnia Magna | Bringing dreams to life">
<meta property="og:description" content="Curated day and night experiences in Toronto, built around people and community.">
<meta property="og:image" content="og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0A0B1F">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#0A0B1F;color:#F3EFDF;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block}
h1,h2,h3,p,ol{margin:0}
ol{padding:0;list-style:none}
.disp{font-family:'Kanit',sans-serif;font-style:italic;text-transform:uppercase}
.pad{padding-left:clamp(24px,5vw,72px);padding-right:clamp(24px,5vw,72px)}
.wrap{max-width:1296px;margin:0 auto}
.kick{font-family:'Kanit',sans-serif;font-style:italic;font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;min-height:56px;padding:0 40px;font-weight:600;font-size:15px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.btn.light{background:#F3EFDF;color:#0A0B1F}
.btn.dark{background:rgba(10,11,31,.72);color:#F3EFDF}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,a:focus-visible{outline:2px solid #7AF3C2;outline-offset:3px}

/* header + hero */
.hero{position:relative;min-height:880px;overflow:hidden;background:linear-gradient(180deg,#0A0B1F 0%,#1B1F4A 40%,#6C5BB8 72%,#E7A9A0 100%)}
.scene{position:absolute;top:0;right:0;width:min(66%,960px);height:100%;clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);background:#1B1F4A}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 60%}
.scene i{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,31,.55) 0%,rgba(10,11,31,0) 38%)}
header.top{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:center;padding-top:28px;padding-bottom:28px}
.logo{font-weight:700;font-size:26px;letter-spacing:.12em}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px 32px;font-size:14px;font-weight:500}
nav a.cta{display:inline-flex;align-items:center;min-height:44px;padding:0 24px;background:#F3EFDF;color:#0A0B1F;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);font-weight:600}
.hero-in{position:relative;z-index:2;max-width:1440px;margin:0 auto;padding-top:72px}
.hero-in .box{max-width:min(640px,100%)}
.tag{display:inline-block;padding:8px 18px;background:rgba(10,11,31,.55);font-size:13px;font-weight:500;letter-spacing:.08em;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
h1.name{margin-top:28px;font-weight:700;font-size:clamp(52px,8vw,120px);line-height:.92;letter-spacing:-.01em}
.motto{margin-top:24px;font-weight:500;font-size:clamp(18px,1.8vw,24px);letter-spacing:.14em}
.sub{margin-top:24px;font-size:18px;line-height:1.6;max-width:34ch}
.btns{margin-top:40px;display:flex;flex-wrap:wrap;gap:16px}

/* light sections */
.light-sec{color:#0A0B1F;padding-top:120px;padding-bottom:120px}
#about{background:#EEEAF7}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:64px 80px;align-items:center}
.about-grid .kick{color:#4B3E9C}
.about-grid h2{margin-top:20px;font-weight:700;font-size:clamp(40px,5.4vw,76px);line-height:1}
.about-grid p{margin-top:32px;font-size:18px;line-height:1.75;max-width:50ch;color:#262851}
.about-img{position:relative;height:480px;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);background:#1B1F4A}
.about-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 60%}

/* what we do */
#do{padding-top:120px;padding-bottom:120px}
#do h2.big,#events h2.big{font-weight:700;font-size:clamp(40px,5vw,72px);line-height:1}
.cards{margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px}
.card{padding:44px 36px 48px;background:#1B1F4A;clip-path:polygon(0 0,100% 0,100% calc(100% - 36px),calc(100% - 36px) 100%,0 100%)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start}
.card .ic{width:48px;height:48px;color:#7AF3C2}
.card .ic svg{width:48px;height:48px}
.card .n{font-size:13px;letter-spacing:.2em;color:rgba(243,239,223,.7)}
.card .w{margin-top:28px;font-family:'Kanit',sans-serif;font-style:italic;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#B9A6FF}
.card h3{margin-top:8px;font-family:'Kanit',sans-serif;font-style:italic;font-weight:700;font-size:36px;text-transform:uppercase}
.card p{margin-top:16px;font-size:16px;line-height:1.7;color:rgba(243,239,223,.88)}

/* stand for */
#stand{background:#DAD6E6;color:#0A0B1F;padding-top:120px;padding-bottom:120px}
.stand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:56px 80px}
.stand-grid .kick{color:#4B3E9C}
.stand-grid h2{margin-top:20px;font-weight:700;font-size:clamp(40px,5vw,68px);line-height:1}
.principles{display:flex;flex-direction:column;gap:20px}
.pr{display:flex;gap:24px;align-items:flex-start;padding:28px;background:#F3EFDF;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 100%,0 100%)}
.pr .num{font-family:'Kanit',sans-serif;font-style:italic;font-weight:700;font-size:40px;line-height:1;color:#4B3E9C}
.pr h3{font-family:'Kanit',sans-serif;font-style:italic;font-weight:600;font-size:24px;text-transform:uppercase}
.pr p{margin-top:8px;font-size:16px;line-height:1.6;color:#262851}

/* events */
#events{background:linear-gradient(135deg,#1B1F4A 0%,#4B3E9C 60%,#B9A6FF 130%);padding-top:120px;padding-bottom:120px}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:48px 80px;align-items:center}
.ev-grid .kick{color:#7AF3C2}
.ev-grid h2{margin-top:20px;font-weight:700;font-size:clamp(48px,7vw,104px);line-height:.95}
.events{display:flex;flex-direction:column;gap:24px}
.ev{padding:44px;background:#0A0B1F;clip-path:polygon(0 0,100% 0,100% calc(100% - 40px),calc(100% - 40px) 100%,0 100%)}
.ev .pl{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#7AF3C2}
.ev h3{margin-top:12px;font-family:'Kanit',sans-serif;font-style:italic;font-weight:700;font-size:40px;text-transform:uppercase;line-height:1.05}
.ev .d{margin-top:20px;font-size:17px;font-weight:500}
.ev p{margin-top:16px;font-size:16px;line-height:1.7;color:rgba(243,239,223,.85)}
.ev a.go{display:inline-flex;margin-top:24px;align-items:center;min-height:48px;padding:0 28px;background:#F3EFDF;color:#0A0B1F;font-weight:600;font-size:14px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.ev a.go:not([href]){display:none}

/* partner */
#partner{background:#F3EFDF;color:#0A0B1F;padding-top:120px;padding-bottom:120px}
.partner-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:56px 80px;align-items:center}
.partner-grid .kick{color:#4B3E9C}
.partner-grid h2{margin-top:20px;font-weight:700;font-size:clamp(44px,6vw,88px);line-height:.98}
.partner-grid p{margin-top:28px;font-size:18px;line-height:1.75;max-width:48ch;color:#262851}
.partner-grid .btn{margin-top:36px;background:#0A0B1F;color:#F3EFDF}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:16px}
.chip{padding:56px 24px 28px;color:#F3EFDF;font-family:'Kanit',sans-serif;font-style:italic;font-weight:600;font-size:24px;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,0 100%);background:#0A0B1F}
.chip:nth-child(3n+2){background:#1B1F4A}
.chip:nth-child(3n){background:#4B3E9C}

/* contact */
#contact{position:relative;overflow:hidden;background:#0A0B1F;padding-top:140px;padding-bottom:48px}
#contact>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%}
#contact .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,31,.85) 0%,rgba(10,11,31,.35) 55%,rgba(10,11,31,.7) 100%)}
#contact .in{position:relative}
#contact .q{font-size:14px;letter-spacing:.1em;text-transform:uppercase}
#contact h2{margin-top:20px;font-weight:700;font-size:clamp(52px,9vw,136px);line-height:.93}
#contact .body{margin-top:28px;font-size:19px;line-height:1.6;max-width:40ch}
#contact .btn{margin-top:36px;background:#F3EFDF;color:#0A0B1F}
.foot{margin-top:120px;padding-top:24px;border-top:1px solid rgba(243,239,223,.35);display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;font-size:14px;font-weight:500}


/* explorer */
.xp{margin-top:56px;display:grid;grid-template-columns:minmax(0,1fr) 400px;border-radius:32px;overflow:hidden;background:#0F1A45}
.xp-map{position:relative;min-height:700px;overflow:hidden}
.xp-map>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.xp-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,31,.4),rgba(10,11,31,0) 30%,rgba(10,11,31,.4))}
.xp-route{position:absolute;inset:0;width:100%;height:100%}
.xp-tabs{position:absolute;top:24px;left:24px;right:24px;display:flex;flex-wrap:wrap;gap:10px;z-index:3}
.xp-tab{height:48px;padding:0 22px;border:0;border-radius:24px;font:600 14px 'DM Sans',sans-serif;color:#F3EFDF;background:rgba(10,11,31,.58);backdrop-filter:blur(10px);cursor:pointer}
.xp-tab[aria-selected=true]{background:#F3EFDF;color:#0A0B1F}
.xp-tab:focus-visible,.xp-pin:focus-visible{outline:2px solid #7AF3C2;outline-offset:3px}
.xp-pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;z-index:3;cursor:pointer}
.xp-pin i{position:absolute;inset:6px;border-radius:50%;background:#0A0B1F;color:#F3EFDF;border:2px solid #F3EFDF;display:flex;align-items:center;justify-content:center;font:600 15px 'DM Sans',sans-serif;font-style:normal;transition:transform .2s}
.xp-pin:hover i{transform:scale(1.12)}
.xp-pin[aria-selected=true] i{background:#7AF3C2;color:#0A0B1F}
.xp-pin[aria-selected=true]::before{content:"";position:absolute;inset:0;border-radius:50%;background:#7AF3C2;animation:xpp 2.4s ease-out infinite}
@keyframes xpp{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.xp-card{position:absolute;z-index:4;width:250px;padding:18px 20px;border-radius:20px;background:#F3EFDF;color:#0A0B1F;box-shadow:0 18px 40px rgba(0,0,0,.35);transition:left .35s,top .35s}
.xp-card-t{font-weight:600;font-size:22px}
.xp-card-c{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.xp-card-c span{padding:5px 12px;border-radius:14px;background:#E1DCF1;font-size:12px;font-weight:600}
.xp-card-c .xp-hl{background:#4B3E9C;color:#F3EFDF}
.xp-side{display:flex;flex-direction:column;gap:14px;padding:24px;background:#0A0B1F}
.xp-main{border-radius:24px;background:#EEEAF7;color:#0A0B1F;overflow:hidden}
.xp-img{position:relative;height:190px;background:#1B1F4A}
.xp-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:object-position .5s}
.xp-word{position:absolute;left:16px;bottom:16px;padding:6px 14px;border-radius:16px;background:#7AF3C2;color:#0A0B1F;font-size:12px;font-weight:600}
.xp-body{padding:22px 24px 26px}
.xp-body h3{font-weight:700;font-size:34px;line-height:1}
.xp-body p{margin-top:14px;font-size:15px;line-height:1.65;color:#262851}
.xp-next{border-radius:24px;background:#F3EFDF;color:#0A0B1F;padding:20px 24px}
.xp-nk{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#4B3E9C}
.xp-nt{margin-top:8px;font-weight:600;font-size:22px}
.xp-nd{margin-top:6px;font-size:14px;color:#262851}
@media (max-width:900px){.xp{grid-template-columns:1fr}.xp-map{min-height:460px}.xp-card{display:none}}
@media (max-width:820px){
  .scene{width:100%;clip-path:none;opacity:.5}
  .scene i{background:linear-gradient(180deg,rgba(10,11,31,.55),rgba(10,11,31,.15))}
  nav a:not(.cta){display:none}
  .hero{min-height:760px}
  .hero-in{padding-top:48px}
  .about-img{height:340px}
  .card,.ev{padding:32px 24px 40px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

  </div>
</section>

<section id="about" class="light-sec pad">
  <div class="wrap about-grid">

      <div class="kick" data-c="about.kicker"></div>

      <p data-c="about.body"></p>

</section>

<section id="do" class="pad">
  <div class="wrap">

      <div class="xp-map">
        <img src="images/terrain-map.jpg" alt="" loading="lazy">
        <div class="xp-shade"></div>
        <svg class="xp-route" id="xp-route" viewBox="0 0 1000 680" preserveAspectRatio="none" aria-hidden="true"><path d="" fill="none" stroke="#7AF3C2" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 12" vector-effect="non-scaling-stroke"/></svg>
        <div class="xp-tabs" id="xp-tabs" role="tablist"></div>
        <div class="xp-pins" id="xp-pins"></div>
        <div class="xp-card" id="xp-card" aria-hidden="true"><div class="xp-card-t disp" id="xp-card-t"></div><div class="xp-card-c"><span class="xp-hl" id="xp-card-w"></span><span>Day or night</span><span>Doors open</span></div></div>
      </div>
      <aside class="xp-side" aria-live="polite">
        <div class="xp-main">
          <div class="xp-img"><img src="images/scene-about.jpg" alt="" id="xp-img" loading="lazy"><span class="xp-word" id="xp-word"></span></div>
          <div class="xp-body"><h3 class="disp" id="xp-title"></h3><p id="xp-text"></p></div>
        </div>
        <div class="xp-next"><div class="xp-nk" data-c="events.kicker"></div><div class="xp-nt disp" id="xp-nt"></div><div class="xp-nd" id="xp-nd"></div></div>
      </aside>
    </div>
  </div>
</section>

<section id="stand" class="pad">
  <div class="wrap stand-grid">
    <div><h2 class="disp" data-c="principles.kicker"></h2></div>
    <ol class="principles" data-list="principles.items">
      <template><li class="pr"><span class="num" data-i></span><div><h3 data-f="title"></h3><p data-f="body"></p></div></li></template>
    </ol>
  </div>
</section>

<section id="events" class="pad">
  <div class="wrap ev-grid">
    <div><div class="kick" data-c="events.kicker"></div><h2 class="disp" data-c="events.heading"></h2></div>
    <div class="events" data-list="events.items">
      <template><article class="ev"><div class="pl" data-f="place"></div><h3 data-f="title"></h3><div class="d" data-f="date"></div><p data-f="blurb"></p><a class="go" data-href-f="link" target="_blank" rel="noopener">Details</a></article></template>
    </div>
  </div>
</section>

<section id="partner" class="pad">
  <div class="wrap partner-grid">
    <div>
      <div class="kick" data-c="partners.kicker"></div>
      <h2 class="disp" data-c="partners.heading"></h2>
      <p data-c="partners.body"></p>
      <a class="btn" data-mail href="#" data-c="contact.button">Get in touch</a>
    </div>
    <div class="chips" data-list="partners.types"><template><div class="chip" data-f="."></div></template></div>
  </div>
</section>

<section id="contact" class="pad">
  <img src="images/scene-contact.jpg" alt="" aria-hidden="true" loading="lazy">
  <div class="shade" aria-hidden="true"></div>
  <div class="wrap in">
    <div class="q"><span data-c="contact.quote"></span> · <span data-c="contact.meaning"></span></div>
    <h2 class="disp" data-c="contact.heading"></h2>
    <p class="body" data-c="contact.body"></p>
    <a class="btn" data-mail href="#" data-c="contact.button">Get in touch</a>
    <div class="foot">
      <span>© <span data-year></span> <span data-c="site.name"></span> · <span data-c="site.city"></span></span>
      <a data-mail href="#" data-c="site.email"></a>
      <a data-ig href="#" target="_blank" rel="noopener" data-ig-handle></a>
    </div>
  </div>
</section>

   Pages CMS editor) and the page updates. You never need to touch this code. */
(function () {
  var ICONS = {"moon": "<path d=\"M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z\"/>", "sparkle": "<path d=\"M12 3c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7Z\"/><path d=\"M19 17.5c.2 1.2.8 1.8 2 2-1.2.2-1.8.8-2 2-.2-1.2-.8-1.8-2-2 1.2-.2 1.8-.8 2-2Z\"/>", "firefly": "<circle cx=\"12\" cy=\"13\" r=\"2.4\"/><path d=\"M12 10.6V8.5M10.2 9 8.5 6.5M13.8 9l1.7-2.5\"/><circle cx=\"12\" cy=\"13\" r=\"6.5\" stroke-dasharray=\"1.5 3\"/>", "pine": "<path d=\"M12 3 7 10h3l-4 6h4l-3 4h10l-3-4h4l-4-6h3l-5-7Z\"/><path d=\"M12 20v1.5\"/>", "mountains": "<path d=\"m2.5 19 6-10 4 6.5 2.5-4 6.5 7.5Z\"/><circle cx=\"17.5\" cy=\"6\" r=\"1.8\"/>", "campfire": "<path d=\"M12 4c1.8 2.6 4 4.4 4 7.2a4 4 0 0 1-8 0c0-1.6.8-2.6 1.6-3.4.2 1.2.8 2 1.6 2.2C11 8 11.2 5.8 12 4Z\"/><path d=\"m5 20 14-3.5M19 20 5 16.5\"/>", "community": "<circle cx=\"12\" cy=\"7.5\" r=\"2.6\"/><circle cx=\"5.5\" cy=\"10\" r=\"2\"/><circle cx=\"18.5\" cy=\"10\" r=\"2\"/><path d=\"M7.5 19.5a4.5 4.5 0 0 1 9 0M2 18a3.6 3.6 0 0 1 4.6-3.4M22 18a3.6 3.6 0 0 0-4.6-3.4\"/>", "partnership": "<circle cx=\"9\" cy=\"12\" r=\"5.5\"/><circle cx=\"15\" cy=\"12\" r=\"5.5\"/>", "ticket": "<path d=\"M3.5 7.5h17v3a2 2 0 0 0 0 4v3h-17v-3a2 2 0 0 0 0-4Z\"/><path d=\"M14.5 7.5v10\" stroke-dasharray=\"1.6 2\"/>", "calendar": "<rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/><path d=\"M3.5 10h17M8 3v4M16 3v4\"/><path d=\"M15.5 14.2a2.2 2.2 0 1 1-2.6-2.6 1.8 1.8 0 0 0 2.6 2.6Z\"/>", "pin": "<path d=\"M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z\"/><circle cx=\"12\" cy=\"10\" r=\"2.3\"/>", "mail": "<rect x=\"3\" y=\"5.5\" width=\"18\" height=\"13\" rx=\"2.5\"/><path d=\"m4 7 8 6 8-6\"/>", "camera": "<rect x=\"3\" y=\"6.5\" width=\"18\" height=\"13\" rx=\"3\"/><circle cx=\"12\" cy=\"13\" r=\"3.6\"/><path d=\"M8.5 6.5 10 4h4l1.5 2.5\"/>", "arrow": "<path d=\"M4 12h15M13.5 6.5 19 12l-5.5 5.5\"/>", "eye-open": "<path d=\"M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z\"/><circle cx=\"12\" cy=\"12\" r=\"2.8\"/>", "door": "<path d=\"M6 21V4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21M3.5 21h17\"/><circle cx=\"14.5\" cy=\"12.5\" r=\".9\" fill=\"currentColor\"/>"};
  function get(obj, path) {
    return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, obj);
  }
  function icon(name) {
    var body = ICONS[name] || ICONS.sparkle;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }
  function all(root, sel) {
    var a = [].slice.call(root.querySelectorAll(sel));
    if (root.matches && root.matches(sel)) a.unshift(root);
    return a;
  }
  function fill(root, data, idx) {
    all(root, '[data-f]').forEach(function (el) {
      var v = get(data, el.getAttribute('data-f'));
      if (v === undefined || v === null || v === '') { if (el.hasAttribute('data-hide-empty')) el.remove(); return; }
      el.textContent = v;
    });
    all(root, '[data-icon]').forEach(function (el) { el.innerHTML = icon(el.getAttribute('data-icon')); });
    all(root, '[data-icon-f]').forEach(function (el) {
      el.innerHTML = icon(get(data, el.getAttribute('data-icon-f')));
    });
    all(root, '[data-i]').forEach(function (el) {
      el.textContent = String(idx + 1).padStart(2, '0');
    });
    all(root, '[data-href-f]').forEach(function (el) {
      var v = get(data, el.getAttribute('data-href-f'));
      if (v) el.setAttribute('href', v); else el.removeAttribute('href');
    });
  }
  function render(c) {
    window.SM_CONTENT = c;
    document.querySelectorAll('[data-c]').forEach(function (el) {
      var v = get(c, el.getAttribute('data-c'));
      if (v !== undefined && v !== null) el.textContent = v;
    });
    document.querySelectorAll('[data-icon]').forEach(function (el) {
      el.innerHTML = icon(el.getAttribute('data-icon'));
    });
    document.querySelectorAll('[data-list]').forEach(function (host) {
      var tpl = host.querySelector('template');
      var items = get(c, host.getAttribute('data-list')) || [];
      host.querySelectorAll('[data-item]').forEach(function (n) { n.remove(); });
      items.forEach(function (item, i) {
        var node = tpl.content.firstElementChild.cloneNode(true);
        node.setAttribute('data-item', '');
        if (typeof item === 'string') {
          all(node, '[data-f="."]').forEach(function (el) { el.textContent = item; });
        } else { fill(node, item, i); }
        host.appendChild(node);
      });
    });
    var email = get(c, 'site.email'), ig = get(c, 'site.instagram');
    document.querySelectorAll('[data-mail]').forEach(function (el) { el.setAttribute('href', 'mailto:' + email); });
    document.querySelectorAll('[data-ig]').forEach(function (el) { el.setAttribute('href', 'https://instagram.com/' + ig); });
    document.querySelectorAll('[data-ig-handle]').forEach(function (el) { el.textContent = '@' + ig; });
    document.querySelectorAll('[data-year]').forEach(function (el) { el.textContent = new Date().getFullYear(); });
    if (get(c, 'site.page_title')) document.title = get(c, 'site.page_title');
    var md = document.querySelector('meta[name="description"]');
    if (md && get(c, 'site.description')) md.setAttribute('content', get(c, 'site.description'));
    document.dispatchEvent(new CustomEvent('sm:rendered'));
  }
  var fallback = JSON.parse(document.getElementById('sm-fallback').textContent);
  render(fallback);
  fetch('content.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(render)
    .catch(function () {});
  window.SM_ICON = icon;
})();
</script>
<script>/* Roam-style explorer. Reads pillars + first event from window.SM_CONTENT (content.json). */
(function(){
  var POS=[[24,74],[46,42],[62,34],[36,22],[74,66],[82,28]];
  var CROP=['50% 60%','70% 50%','30% 60%','50% 30%','80% 70%','20% 40%'];
  var sel=0, built=false;
  function $(id){return document.getElementById(id);}
  function build(c){
    var P=c.pillars||[]; if(!P.length||!$('xp')) return;
    var tabs=$('xp-tabs'), pins=$('xp-pins');
    tabs.innerHTML=''; pins.innerHTML='';
    P.forEach(function(p,i){
      var pos=POS[i%POS.length];
      var t=document.createElement('button'); t.className='xp-tab'; t.type='button'; t.setAttribute('role','tab'); t.textContent=p.title;
      t.addEventListener('click',function(){pick(i);}); tabs.appendChild(t);
      var b=document.createElement('button'); b.className='xp-pin'; b.type='button'; b.setAttribute('aria-label',p.title);
      b.style.left=pos[0]+'%'; b.style.top=pos[1]+'%'; b.innerHTML='<i>'+(i+1)+'</i>';
      b.addEventListener('click',function(){pick(i);}); pins.appendChild(b);
    });
    var pts=P.map(function(_,i){var q=POS[i%POS.length];return [q[0]*10,q[1]*6.8];});
    var d='M'+pts[0][0]+' '+pts[0][1];
    for(var k=1;k<pts.length;k++){var a=pts[k-1],b2=pts[k],mx=(a[0]+b2[0])/2;d+=' C'+mx+' '+a[1]+','+mx+' '+b2[1]+','+b2[0]+' '+b2[1];}
    $('xp-route').firstElementChild.setAttribute('d',d);
    var ev=(c.events&&c.events.items&&c.events.items[0])||{};
    $('xp-nt').textContent=ev.title||'';
    $('xp-nd').textContent=[ev.date,ev.place].filter(Boolean).join(' · ');
    built=true; if(sel>=P.length) sel=0; pick(sel);
  }
  function pick(i){
    var c=window.SM_CONTENT, p=c.pillars[i], pos=POS[i%POS.length];
    [].forEach.call($('xp-tabs').children,function(n,k){n.setAttribute('aria-selected',k===i);});
    [].forEach.call($('xp-pins').children,function(n,k){n.setAttribute('aria-selected',k===i);});
    $('xp-title').textContent=p.title; $('xp-text').textContent=p.body;
    $('xp-word').textContent=p.word||''; $('xp-card-t').textContent=p.title; $('xp-card-w').textContent=p.word||'';
    $('xp-img').style.objectPosition=CROP[i%CROP.length];
    var card=$('xp-card'); card.style.left='calc('+pos[0]+'% + 34px)'; card.style.top='calc('+pos[1]+'% - 40px)';
    sel=i;
  }
  document.addEventListener('sm:rendered',function(){build(window.SM_CONTENT);});
  if(window.SM_CONTENT&&!built) build(window.SM_CONTENT);
})();
</script>
