<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Somnia Magna | Bringing dreams to life</title>
<meta name="description" content="Curated day and night experiences in Toronto, built around people and community instead of the bar.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Somnia Magna | Bringing dreams to life">
<meta property="og:description" content="Curated day and night experiences in Toronto, built around people and community instead of the bar.">
<meta property="og:image" content="og-image.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* All words and places live in content.json (edit it in Pages CMS). This file is layout and the globe. */
:root{
  --card:#EEEAF7; --ink:#0A0B1F; --cream:#F3EFDF; --violet:#4B3E9C; --soft:#262851; --muted:#4B4B6B;
  --gutter:24px; --tabw:26px; --tabh:88px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;color:var(--cream);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit}
a{color:inherit}
#stage{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;background:#000 url(images/earth-2k.jpg) center/cover no-repeat}
#stage.gl{background:#000}
#stage::before{content:"";position:absolute;z-index:2;left:0;right:0;top:0;height:130px;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0));pointer-events:none}
#stage::after{content:"";position:absolute;z-index:2;left:0;right:0;bottom:0;height:220px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.5));pointer-events:none}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{cursor:grab;touch-action:none}
#ov.drag{cursor:grabbing}
#stage:not(.gl) #gl,#stage:not(.gl) #ov{display:none}

/* top-left: logo + section tabs */
#top{position:absolute;z-index:6;top:24px;left:40px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;
  max-width:calc(100% - 80px);transition:max-width .45s cubic-bezier(.3,.7,.2,1)}
#stage.open #top{max-width:calc(100% - max(404px,40vw) - 60px)}
#logo{display:block;height:26px;width:auto;margin-right:22px}
.tab{height:40px;padding:0 18px;border-radius:20px;border:0;background:transparent;color:var(--cream);font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.tab:not([aria-selected=true]){text-shadow:0 1px 8px rgba(0,0,0,.7)}
.tab:hover{background:rgba(243,239,223,.14)}
.tab[aria-selected=true]{background:var(--cream);color:var(--ink)}

/* title block, bottom left */
#brand{position:absolute;z-index:3;left:40px;bottom:40px;pointer-events:none;transition:opacity .3s}
#brand img{display:block;width:clamp(240px,24vw,380px);height:auto;margin-left:-5px}
#motto{margin:12px 0 0;font-size:clamp(20px,1.9vw,30px);line-height:1.2;font-weight:500;letter-spacing:.01em;color:var(--cream);text-shadow:0 2px 18px rgba(0,0,0,.6)}

/* dock = card + pull tab. The tab hangs off the card's left edge; closed, the dock slides off and the tab ends exactly on the screen edge. */
#dock{position:absolute;z-index:5;top:var(--gutter);bottom:var(--gutter);right:0;width:max(404px,40vw);padding-right:var(--gutter);
  transform:translateX(0);transition:transform .45s cubic-bezier(.3,.7,.2,1)}
#stage:not(.open) #dock{transform:translateX(100%)}
#tab{position:absolute;z-index:2;right:calc(100% - 1px);top:50%;margin-top:calc(var(--tabh) / -2);width:calc(var(--tabw) + 1px);height:var(--tabh);
  border:0;outline:0;padding:0;background:var(--card);border-radius:22px 0 0 22px;display:flex;align-items:center;justify-content:center;box-shadow:none}
#tab::before{content:"";position:absolute;inset:-10px -4px -10px -10px}
#tab i{display:block;width:4px;height:30px;border-radius:2px;background:var(--ink);opacity:.45;margin-right:1px}
#tab:focus-visible{outline:2px solid #7AF3C2;outline-offset:2px}
#card{position:relative;height:100%;overflow:hidden;border-radius:28px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.55)}

#bar{position:relative;display:flex;gap:8px;align-items:center;padding:20px 20px 0;flex:none}
#sf{flex:1;min-width:0;height:46px;border-radius:23px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px}
#sf input{flex:1;min-width:0;border:0;background:none;font-size:14px;font-weight:500;color:var(--ink);outline:none}
.round{position:relative;flex:none;width:46px;height:46px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;text-decoration:none}
#bellbadge{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#E5484D;border:2px solid #fff;box-sizing:content-box}
#na{background:var(--violet);color:var(--cream);font-size:13px;font-weight:600}
#na img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop{position:absolute;z-index:9;top:74px;border-radius:20px;background:var(--ink);color:var(--cream);padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
#sug{left:20px;right:20px}
#bellbox{right:20px;width:min(280px,calc(100% - 40px));padding:14px}
.drop button,.drop a{display:block;width:100%;text-align:left;border:0;background:none;color:var(--cream);padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500;text-decoration:none}
.drop button:hover,.drop a:hover{background:rgba(243,239,223,.1)}
.drop small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7AF3C2;font-weight:600}
.drop .hd{padding:0 12px 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7AF3C2;font-weight:600}
[hidden]{display:none!important}

#body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 24px 28px;-webkit-overflow-scrolling:touch}
h1.vt{margin:0;font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.lead{margin:12px 0 0;font-size:15px;line-height:1.65;color:var(--soft)}
.h{margin:24px 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);font-weight:600}

/* list rows: name and "place · date" each stay on ONE line */
.row{display:block;width:100%;text-align:left;border:0;padding:0;margin:0 0 8px;border-radius:16px;background:rgba(255,255,255,.55);color:var(--ink);overflow:hidden}
.row.on{background:#fff}
.rh{display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0}
.dotc{flex:none;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 4px rgba(10,11,31,.08)}
.thumb{flex:none;width:44px;height:44px;border-radius:12px;object-fit:cover;background:#ddd}
.rt{flex:1;min-width:0}
.t1,.t2{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1{font-size:14px;font-weight:700;line-height:1.3}
.t2{font-size:12px;color:var(--muted);line-height:1.4;margin-top:1px}
.tag{flex:none;padding:2px 8px;border-radius:10px;background:#FFE9A8;color:#5A4300;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.more{padding:0 14px 14px 38px}
.more.nothumb{padding-left:14px}
.more p{margin:0 0 10px;font-size:14px;line-height:1.55;color:var(--soft);white-space:normal}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.strip button{flex:none;width:92px;height:68px;border:0;padding:0;border-radius:12px;overflow:hidden;background:#ddd}
.strip img,.grid img{display:block;width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{position:relative;border:0;padding:0;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#ddd}
.grid span{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 7px;background:linear-gradient(transparent,rgba(10,11,31,.72));color:#fff;font-size:11px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{padding:14px 16px;border-radius:16px;background:#fff;margin-bottom:8px}
.box b{display:block;font-size:15px}
.box p{margin:6px 0 0;font-size:14px;line-height:1.55;color:var(--soft)}
.quote p{font-style:italic;font-size:15px;margin:0}
.quote b{font-size:13px;margin-top:10px}
.cta{display:inline-flex;align-items:center;margin-top:16px;height:44px;padding:0 22px;border-radius:22px;background:var(--ink);color:var(--cream);font-size:14px;font-weight:600;text-decoration:none}

/* popup for a selected globe dot */
#pop{position:absolute;z-index:4;width:250px;border-radius:20px;background:var(--cream);color:var(--ink);overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.4);left:0;top:0;opacity:0;pointer-events:none;transition:opacity .25s}
#pop.show{opacity:1;pointer-events:auto}
#pop button.im{display:block;width:100%;height:140px;border:0;padding:0;background:#ddd}
#pop img{display:block;width:100%;height:100%;object-fit:cover}
#pop .pb{padding:14px 16px 16px}
#pop .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);font-weight:600}
#pop .n{margin-top:4px;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pop .s{margin-top:2px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pop .tag{display:inline-block;margin-top:8px}

/* photo viewer */
#lb{position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 16px 24px}
#lb img{max-width:min(94vw,1200px);max-height:calc(100dvh - 140px);border-radius:14px;object-fit:contain}
#lb p{margin:14px 0 0;font-size:14px;color:var(--cream);text-align:center;max-width:90vw}
#lb .x,#lb .nv{position:absolute;border:0;border-radius:50%;width:44px;height:44px;background:rgba(243,239,223,.14);color:var(--cream);font-size:22px;line-height:1}
#lb .x{top:max(14px,env(safe-area-inset-top));right:14px}
#lb .nv{top:50%;margin-top:-22px}
#lb .pv{left:14px}#lb .nx{right:14px}

@media (max-width:820px){
  #pop{width:min(340px,calc(100% - 32px));display:flex;align-items:stretch;border-radius:18px}
  #pop button.im{width:72px;height:auto;flex:none}
  #pop .pb{padding:10px 14px 11px;min-width:0;flex:1}
  #pop .n{font-size:15px;margin-top:2px}
  #pop .tag{margin-top:5px}
}
@media (prefers-reduced-motion:reduce){#dock{transition:none}}

/* ---------- phones and small tablets: card becomes a bottom sheet, same elements ---------- */
@media (max-width:820px){
  #top{top:max(14px,env(safe-area-inset-top));left:0;right:0;max-width:none!important;flex-wrap:nowrap;flex-direction:column;align-items:stretch;gap:10px}
  #logo{height:22px;margin:0 0 0 20px;align-self:flex-start}
  #tabs{display:flex;gap:4px;overflow-x:auto;padding:0 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #tabs::-webkit-scrollbar{display:none}
  .tab{height:36px;padding:0 14px;font-size:13px;flex:none;background:rgba(0,0,0,.35)}
  .tab[aria-selected=true]{background:var(--cream)}
  #brand{left:20px;bottom:calc(46px + env(safe-area-inset-bottom))}
  #brand img{width:min(62vw,260px)}
  #motto{font-size:19px;margin-top:8px}
  #stage.open #brand{opacity:0}
  #dock{top:auto;left:0;right:0;bottom:0;width:auto;height:54vh;height:54dvh;padding:0}
  #stage:not(.open) #dock{transform:translateY(100%)}
  #tab{right:auto;left:50%;top:auto;margin:0;bottom:calc(100% - 1px);transform:translateX(-50%);
    width:88px;height:calc(var(--tabw) + 1px);border-radius:22px 22px 0 0}
  #tab::before{inset:-10px -10px -4px -10px}
  #tab i{width:30px;height:4px;margin:0 0 1px 0}
  #card{border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
  #bar{padding:16px 16px 0}
  #body{padding:16px 18px calc(24px + env(safe-area-inset-bottom))}
  h1.vt{font-size:26px}
  #sug{left:16px;right:16px}
  #bellbox{right:16px}
}
@media (max-width:360px){.tab{padding:0 11px}}
</style>
</head>
<body>
<main id="stage" class="open">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="ov" aria-label="Interactive globe. Drag to spin, scroll or pinch to zoom, tap a dot to see it."></canvas>

  <header id="top">
    <img id="logo" src="images/brand/soma-wordmark-white.png" alt="SOMA">
    <nav id="tabs" role="tablist" aria-label="Sections"></nav>
  </header>

  <div id="brand">
    <img src="images/brand/somnia-magna-wordmark-white.png" alt="Somnia Magna">
    <p id="motto">Bringing dreams to life</p>
  </div>

  <div id="pop" role="dialog" aria-live="polite"></div>

  <div id="dock">
    <button id="tab" type="button" aria-label="Hide panel" aria-expanded="true" aria-controls="card"><i></i></button>
    <aside id="card" aria-label="Details">
      <div id="bar">
        <div id="sf">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#0A0B1F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="q" type="search" autocomplete="off" placeholder="Search places, events, stories" aria-label="Search">
        </div>
        <button id="bell" class="round" type="button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#0A0B1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15Z"/><path d="M10 21h4"/></svg>
          <span id="bellbadge"></span>
        </button>
        <a id="na" class="round" href="https://www.linkedin.com/in/njauyeung/" aria-label="Nathan on LinkedIn" target="_blank" rel="noopener">NA</a>
        <div id="sug" class="drop" hidden></div>
        <div id="bellbox" class="drop" hidden></div>
      </div>
      <div id="body"></div>
    </aside>
  </div>

  <div id="lb" hidden></div>
</main>
<noscript><p style="position:fixed;inset:auto 20px 20px;color:#F3EFDF;font-family:sans-serif">Somnia Magna · Toronto · hello@somniamagna.ca</p></noscript>

<script>
(function () {
'use strict';

/* ---------------------------------------------------------------- helpers */
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var MAXN = 28;                                  // longest event / partner / photo name that is shown (one line)
var clip = function (s, n) { s = String(s == null ? '' : s).trim().replace(/\s+/g, ' '); n = n || MAXN; return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };
var src = function (p) { p = String(p || '').trim(); return /^(https?:)?\/\/|^data:/.test(p) ? p : p.replace(/^\/+/, ''); };
var isMobile = function () { return window.matchMedia('(max-width:820px)').matches; };
var reduceMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function fmtDate(d) {                           // "2026-12-12" -> "Sat, Dec 12"; anything else is shown as typed
  d = String(d || '').trim();
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  if (!m) return d;
  var dt = new Date(+m[1], +m[2] - 1, +m[3]);
  if (isNaN(dt)) return d;
  var o = { weekday: 'short', month: 'short', day: 'numeric' };
  if (dt.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return dt.toLocaleDateString('en-US', o);
}

/* cities the CMS can name without typing coordinates [lon, lat] */
var CITIES = {
  'toronto': [-79.38, 43.65], 'montreal': [-73.57, 45.5], 'ottawa': [-75.7, 45.42], 'vancouver': [-123.12, 49.28], 'calgary': [-114.07, 51.05],
  'edmonton': [-113.49, 53.55], 'winnipeg': [-97.14, 49.9], 'halifax': [-63.57, 44.65], 'quebec city': [-71.21, 46.81], 'new york': [-74.0, 40.71],
  'boston': [-71.06, 42.36], 'chicago': [-87.63, 41.88], 'los angeles': [-118.24, 34.05], 'san francisco': [-122.42, 37.77], 'seattle': [-122.33, 47.61],
  'miami': [-80.19, 25.76], 'austin': [-97.74, 30.27], 'washington': [-77.04, 38.91], 'london': [-0.13, 51.51], 'paris': [2.35, 48.86],
  'berlin': [13.4, 52.52], 'amsterdam': [4.9, 52.37], 'lisbon': [-9.14, 38.72], 'madrid': [-3.7, 40.42], 'barcelona': [2.17, 41.39],
  'rome': [12.5, 41.9], 'dublin': [-6.26, 53.35], 'zurich': [8.54, 47.38], 'stockholm': [18.07, 59.33], 'dubai': [55.27, 25.2],
  'singapore': [103.82, 1.35], 'hong kong': [114.17, 22.32], 'tokyo': [139.69, 35.68], 'seoul': [126.98, 37.57], 'shanghai': [121.47, 31.23],
  'beijing': [116.41, 39.9], 'sydney': [151.21, -33.87], 'melbourne': [144.96, -37.81], 'mumbai': [72.88, 19.08], 'mexico city': [-99.13, 19.43],
  'sao paulo': [-46.63, -23.55], 'buenos aires': [-58.38, -34.6], 'lagos': [3.38, 6.52], 'cape town': [18.42, -33.92], 'cairo': [31.24, 30.04],
  'istanbul': [28.98, 41.01], 'tel aviv': [34.78, 32.09]
};
function coords(it) {
  var lon = parseFloat(it.lon), lat = parseFloat(it.lat);
  if (isFinite(lon) && isFinite(lat) && it.lon !== '' && it.lat !== '' && it.lon != null && it.lat != null) return [lon, lat];
  var k = String(it.place || '').split(',')[0].trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  return CITIES[k] || null;
}

/* ---------------------------------------------------------------- content -> layers */
var C = null, LAYERS = [], MAIL = 'hello@somniamagna.ca';
var COLORS = { events: '#7AF3C2', partners: '#FFB27A', community: '#F7A8C8', about: '#FFE08A' };

function build(c) {
  C = c; MAIL = (c.site && c.site.email) || MAIL;
  var ev = c.events || {}, pa = c.partners || {}, co = c.community || {}, ab = c.about || {};
  var events = (ev.items || []).map(function (e) {
    var p = coords(e);
    return { kind: 'event', label: clip(e.title), full: e.title, place: e.place || '', date: fmtDate(e.date), lon: p && p[0], lat: p && p[1], has: !!p,
      sample: !!e.sample, blurb: e.blurb || '', photos: (e.photos || []).filter(function (x) { return x && x.image; }).map(function (x) { return { src: src(x.image), cap: x.caption || '' }; }) };
  });
  var partners = (pa.items || []).map(function (e) {
    var p = coords(e);
    return { kind: 'partner', label: clip(e.name), full: e.name, place: e.place || '', date: e.type || '', lon: p && p[0], lat: p && p[1], has: !!p, sample: !!e.sample, photos: [] };
  });
  var shared = (co.items || []).map(function (e) {
    var p = coords(e), ph = e.image ? [{ src: src(e.image), cap: e.caption || '' }] : [];
    return { kind: 'photo', label: clip(e.caption), full: e.caption, place: e.place || '', date: '', lon: p && p[0], lat: p && p[1], has: !!p, sample: !!e.sample, photos: ph };
  });
  var op = coords({ place: ab.origin_place || 'Toronto' }) || [-79.38, 43.65];
  var origin = { kind: 'origin', label: ab.origin_label || 'Where SOMA began', full: ab.origin_label, place: ab.origin_place || 'Toronto', date: '', lon: op[0], lat: op[1], has: true, origin: true, photos: [] };
  LAYERS = [
    { key: 'events', name: 'Events', title: ev.title || 'Events', lead: ev.lead, head: ev.list_heading, color: COLORS.events, view: [-76, 40], items: events },
    { key: 'partners', name: 'Partnerships', title: pa.title || 'Partnerships', lead: pa.lead, head: pa.list_heading, color: COLORS.partners, view: [-60, 42], items: partners },
    { key: 'community', name: 'Community', title: co.title || 'Community', lead: co.lead, head: co.list_heading, color: COLORS.community, view: [-40, 35], items: shared },
    { key: 'about', name: 'About', title: ab.heading || 'About', lead: ab.body, head: ab.list_heading, color: COLORS.about, view: [op[0], op[1]], items: [origin] }
  ];
  var s = c.site || {};
  $('#motto').textContent = s.motto || 'Bringing dreams to life';
  if (s.page_title) document.title = s.page_title;
}

/* ---------------------------------------------------------------- state */
var S = { i: 0, open: true, sel: -1, q: '', bell: false, badge: true, exp: -1 };
var g = { lon: -60, lat: 25, target: [-76, 40, 1], vx: 0, vy: 0, drag: false, idle: 0, zoom: 1 };
var stage = $('#stage');

function setOpen(o) {
  S.open = o; stage.classList.toggle('open', o);
  var t = $('#tab'); t.setAttribute('aria-label', o ? 'Hide panel' : 'Show panel'); t.setAttribute('aria-expanded', String(o));
  if (!o) closePop();
}
function selectTab(k) {
  S.i = k; S.sel = -1; S.q = ''; S.bell = false; S.exp = -1; $('#q').value = '';
  g.target = LAYERS[k].view.concat([1]); setOpen(true);
  renderTabs(); renderBody(true); renderDrops(); popUpdate();
}
function selectItem(k, idx, fromList) {
  S.i = k; S.sel = idx; S.q = ''; S.bell = false; $('#q').value = '';
  var it = LAYERS[k].items[idx];
  S.exp = idx;
  if (it && it.has) g.target = [it.lon, it.lat, Math.max(g.zoom, 2.2)];
  setOpen(true); renderTabs(); renderBody(false); renderDrops(); popUpdate();
}
function closePop() { S.sel = -1; S.exp = -1; popUpdate(); if ($('#body').firstChild) renderBody(false); }

/* ---------------------------------------------------------------- DOM render */
function renderTabs() {
  $('#tabs').innerHTML = LAYERS.map(function (l, k) {
    return '<button class="tab" role="tab" type="button" aria-selected="' + (k === S.i) + '" data-tab="' + k + '">' + esc(l.name) + '</button>';
  }).join('');
}

function tagHTML(it) { return it.sample ? '<span class="tag">Sample</span>' : ''; }
function sub(it) { return [it.place, it.date].filter(Boolean).join(' · '); }

function rowHTML(L, k, it) {
  var on = S.sel === k, open = S.exp === k;
  var lead = it.kind === 'photo' && it.photos[0] ? '<img class="thumb" src="' + esc(it.photos[0].src) + '" alt="" loading="lazy">'
    : '<span class="dotc" style="background:' + L.color + '"></span>';
  var more = '';
  if (open && (it.blurb || (it.kind === 'event' && it.photos.length))) {
    more = '<div class="more">' + (it.blurb ? '<p>' + esc(it.blurb) + '</p>' : '') +
      (it.kind === 'event' && it.photos.length ? '<div class="strip">' + it.photos.map(function (p, n) {
        return '<span role="presentation" style="display:contents"><button type="button" data-photo="' + k + ':' + n + '" aria-label="Open photo"><img src="' + esc(p.src) + '" alt="' + esc(p.cap) + '" loading="lazy"></button></span>';
      }).join('') + '</div>' : '') + '</div>';
  }
  return '<div class="row' + (on ? ' on' : '') + '"><button class="rh" type="button" data-item="' + k + '" title="' + esc((it.full || it.label) + (sub(it) ? ' — ' + sub(it) : '')) + '" style="width:100%;border:0;background:none;text-align:left">' +
    lead + '<span class="rt"><span class="t1">' + esc(it.label) + '</span><span class="t2">' + esc(sub(it)) + '</span></span>' + tagHTML(it) + '</button>' + more + '</div>';
}

function renderBody(reset) {
  var L = LAYERS[S.i], el = $('#body'), top = reset ? 0 : el.scrollTop, h = '';
  h += '<h1 class="vt">' + esc(L.title) + '</h1>';
  if (L.lead) h += '<p class="lead">' + esc(L.lead) + '</p>';
  if (L.key !== 'about' || L.items.length) {
    h += '<div class="h">' + esc(L.head || '') + '</div>';
    h += L.items.map(function (it, k) { return rowHTML(L, k, it); }).join('');
  }
  if (L.key === 'partners') {
    var pa = C.partners || {};
    h += '<div class="h">' + esc(pa.work_heading || 'Work with us') + '</div><p class="lead" style="margin-top:0">' + esc(pa.body || '') + '</p>' +
      '<a class="cta" href="mailto:' + esc(MAIL) + '">' + esc(pa.button || 'Get in touch') + '</a>';
  }
  if (L.key === 'community') {
    var co = C.community || {}, all = galleryAll();
    if (all.length) {
      h += '<div class="h">' + esc(co.gallery_heading || 'Photos from our events') + '</div><div class="grid">' + all.map(function (p, n) {
        return '<button type="button" data-gal="' + n + '" aria-label="Open photo"><img src="' + esc(p.src) + '" alt="' + esc(p.cap) + '" loading="lazy"><span>' + esc(clip(p.cap, 34)) + '</span></button>';
      }).join('') + '</div>';
    }
    if ((co.stories || []).length) {
      h += '<div class="h">' + esc(co.stories_heading || 'Community stories') + '</div>' + co.stories.map(function (s) {
        return '<div class="box quote"><p>“' + esc(s.quote) + '”</p><b>' + esc(s.name) + '</b>' + (s.sample ? '<span class="tag" style="display:inline-block;margin-top:6px">Sample</span>' : '') + '</div>';
      }).join('');
    }
    h += '<div class="h">' + esc(co.share_heading || 'Share your photos') + '</div><p class="lead" style="margin-top:0">' + esc(co.share_body || '') + '</p>' +
      '<a class="cta" href="mailto:' + esc(MAIL) + '?subject=' + encodeURIComponent('Photos from a Somnia Magna event') + '">' + esc(co.share_button || 'Send photos') + '</a>';
  }
  if (L.key === 'about') {
    var ab = C.about || {}, pr = (C.principles || {}), ct = C.contact || {};
    h += '<div class="h">' + esc(ab.principles_heading || pr.kicker || 'What we stand for') + '</div>' + (pr.items || []).map(function (r) {
      return '<div class="box"><b>' + esc(r.title) + '</b><p>' + esc(r.body) + '</p></div>';
    }).join('');
    h += '<div class="h">' + esc(ab.name_heading || 'The name') + '</div><div class="box"><b>' + esc(ct.quote || 'Somnia magna') + '</b><p>' + esc(ct.meaning || '') + '</p></div>' +
      '<a class="cta" href="mailto:' + esc(MAIL) + '">' + esc(ab.button || 'Get in touch') + '</a>';
  }
  el.innerHTML = h; el.scrollTop = top;
}

function galleryAll() {                         // every event photo, labelled with its event
  var out = [];
  LAYERS[0].items.forEach(function (it) { it.photos.forEach(function (p) { out.push({ src: p.src, cap: (it.full || it.label) + (p.cap && p.cap !== 'Sample photo' ? ' · ' + p.cap : ''), place: it.place }); }); });
  return out;
}

function renderDrops() {
  var q = S.q.trim().toLowerCase(), sug = $('#sug');
  if (!q) sug.hidden = true;
  else {
    var res = [];
    LAYERS.forEach(function (l, k) {
      if (l.name.toLowerCase().indexOf(q) > -1) res.push({ g: 'Section', t: l.name, a: 'tab', k: k });
      l.items.forEach(function (it, n) { var s = (it.full || it.label) + ' ' + it.place + ' ' + it.date; if (s.toLowerCase().indexOf(q) > -1) res.push({ g: l.name, t: it.label + ' · ' + it.place, a: 'item', k: k, n: n }); });
    });
    res = res.slice(0, 7);
    sug.innerHTML = res.length ? res.map(function (r) { return '<button type="button" data-sug="' + r.a + ':' + r.k + ':' + (r.n == null ? '' : r.n) + '"><small>' + esc(r.g) + '</small>' + esc(r.t) + '</button>'; }).join('') : '<div class="hd" style="padding:10px 12px 8px;color:#C9C6E3">Nothing found</div>';
    sug.hidden = false;
  }
  var bb = $('#bellbox'); bb.hidden = !S.bell;
  $('#bellbadge').hidden = !S.badge;
  if (S.bell) {
    var next = LAYERS[0].items.filter(function (e) { return !e.sample; })[0];
    bb.innerHTML = '<div class="hd">Notifications</div>' +
      (next ? '<button type="button" data-next="1">' + esc(next.label) + ': ' + esc((next.date || 'date to be announced').replace(/^./, function (c) { return c.toLowerCase(); })) + '</button>' : '') +
      '<a href="mailto:' + esc(MAIL) + '" style="color:#C9C6E3">Questions? ' + esc(MAIL) + '</a>';
  }
}

/* ---------------------------------------------------------------- popup by the globe */
var lbList = [], lbI = 0;
function selItem() { var L = LAYERS[S.i]; return S.sel >= 0 ? L.items[S.sel] : null; }
function popUpdate() {
  var it = selItem(), pop = $('#pop'), L = LAYERS[S.i];
  if (!it || it.origin) { pop.classList.remove('show'); pop.innerHTML = ''; pop.dataset.k = ''; return; }
  var key = S.i + ':' + S.sel;
  if (pop.dataset.k !== key) {
    pop.dataset.k = key;
    pop.innerHTML = (it.photos[0] ? '<button class="im" type="button" data-popphoto="1" aria-label="Open photo"><img src="' + esc(it.photos[0].src) + '" alt=""></button>' : '') +
      '<div class="pb"><div class="k">' + esc(L.name) + '</div><div class="n">' + esc(it.label) + '</div><div class="s">' + esc(sub(it)) + '</div>' + tagHTML(it) + '</div>';
  }
  pop.classList.add('show');
}
function placePop(x, y, W, H) {                // keep the popup beside its dot, inside the globe area
  var pop = $('#pop'); if (!pop.classList.contains('show')) return;
  var w = pop.offsetWidth, h = pop.offsetHeight, px, py;
  if (isMobile()) { px = (W - w) / 2; py = lay.nav + 2; }
  else {
    px = x + 26; if (px + w > lay.right - 12) px = x - 26 - w;
    px = Math.max(12, Math.min(lay.right - w - 12, px));
    py = Math.max(90, Math.min(H - h - 16, y - h / 2));
  }
  pop.style.transform = 'translate(' + Math.round(px) + 'px,' + Math.round(py) + 'px)';
}

/* ---------------------------------------------------------------- photo viewer */
function openLB(list, i) { lbList = list; lbI = i; drawLB(); $('#lb').hidden = false; }
function drawLB() {
  var p = lbList[lbI]; if (!p) return;
  var multi = lbList.length > 1;
  $('#lb').innerHTML = '<button class="x" type="button" data-lb="x" aria-label="Close">×</button>' +
    (multi ? '<button class="nv pv" type="button" data-lb="p" aria-label="Previous">‹</button><button class="nv nx" type="button" data-lb="n" aria-label="Next">›</button>' : '') +
    '<img src="' + esc(p.src) + '" alt="' + esc(p.cap) + '">' + (p.cap ? '<p>' + esc(p.cap) + (p.place ? ' · ' + esc(p.place) : '') + '</p>' : '');
}
function closeLB() { $('#lb').hidden = true; $('#lb').innerHTML = ''; }

/* ---------------------------------------------------------------- events */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab],[data-item],[data-sug],[data-photo],[data-gal],[data-popphoto],[data-lb],[data-next],#tab,#bell');
  var inBar = e.target.closest('#bar');
  if (!inBar && (S.bell || S.q)) { /* click away closes drops */ if (S.bell) { S.bell = false; renderDrops(); } }
  if (!t) return;
  if (t.id === 'tab') { setOpen(!S.open); return; }
  if (t.id === 'bell') { S.bell = !S.bell; S.badge = false; renderDrops(); return; }
  if (t.dataset.tab != null) { selectTab(+t.dataset.tab); return; }
  if (t.dataset.item != null) {
    var k = S.i, idx = +t.dataset.item;
    if (S.sel === idx && S.exp === idx) { S.exp = -1; S.sel = -1; popUpdate(); renderBody(false); } else selectItem(k, idx, true);
    return;
  }
  if (t.dataset.sug) { var a = t.dataset.sug.split(':'); if (a[0] === 'tab') selectTab(+a[1]); else selectItem(+a[1], +a[2]); return; }
  if (t.dataset.next) { selectTab(0); return; }
  if (t.dataset.photo) { var pr = t.dataset.photo.split(':'), it = LAYERS[S.i].items[+pr[0]]; openLB(it.photos.map(function (p) { return { src: p.src, cap: p.cap || it.full || it.label, place: it.place }; }), +pr[1]); return; }
  if (t.dataset.gal != null) { var all = galleryAll(); openLB(all, +t.dataset.gal); return; }
  if (t.dataset.popphoto) { var s = selItem(); if (s && s.photos.length) openLB(s.photos.map(function (p) { return { src: p.src, cap: p.cap || s.full || s.label, place: s.place }; }), 0); return; }
  if (t.dataset.lb) {
    if (t.dataset.lb === 'x') closeLB();
    else { lbI = (lbI + (t.dataset.lb === 'n' ? 1 : -1) + lbList.length) % lbList.length; drawLB(); }
  }
});
$('#lb').addEventListener('click', function (e) { if (e.target === $('#lb')) closeLB(); });
$('#q').addEventListener('input', function (e) { S.q = e.target.value; S.bell = false; renderDrops(); });
document.addEventListener('keydown', function (e) {
  if (!$('#lb').hidden) {
    if (e.key === 'Escape') closeLB();
    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && lbList.length > 1) { lbI = (lbI + (e.key === 'ArrowRight' ? 1 : -1) + lbList.length) % lbList.length; drawLB(); }
    return;
  }
  if (e.key === 'Escape') { S.q = ''; $('#q').value = ''; S.bell = false; renderDrops(); if (S.sel >= 0) closePop(); }
});

/* NA badge: use images/avatar.jpg when it exists, otherwise the initials stay */
(function () { var im = new Image(); im.alt = ''; im.onload = function () { $('#na').textContent = ''; $('#na').appendChild(im); }; im.src = 'images/avatar.jpg'; })();

/* ---------------------------------------------------------------- globe */
var cvGL = $('#gl'), ov = $('#ov'), ctx = ov.getContext('2d'), gl = null, U = {}, W = 0, H = 0, dpr = 1;
var lay = { cx: null, cy: 0, R: 300, base: 300, top: 0, right: 0 };
var T0 = performance.now();
var coarse = window.matchMedia('(pointer:coarse)').matches;

function initGL() {
  try { gl = cvGL.getContext('webgl2', { antialias: true, premultipliedAlpha: false }); } catch (e) { gl = null; }
  if (!gl) return false;
  var vs = '#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs = '#version 300 es\n' +
'precision highp float;\n' +
'uniform vec2 uRes; uniform vec2 uC; uniform float uR; uniform vec2 uRot; uniform float uDpr; uniform float uT;\n' +
'uniform sampler2D uDay; uniform sampler2D uTopo;\n' +
'out vec4 o;\n' +
'const float PI=3.14159265;\n' +
'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}\n' +
'void main(){\n' +
'  vec2 fc=vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y)/uDpr;\n' +
'  vec2 q=(fc-uC)/uR; q.y=-q.y;\n' +
'  float r2=dot(q,q);\n' +
'  vec2 cell=floor(fc/3.);\n' +
'  float s=h21(cell); vec3 bg=vec3(0.);\n' +
'  if(s>0.9965){float tw=.55+.45*sin(uT*1.4+s*60.);bg=vec3(.85,.88,1.)*tw*(s-.9965)/.0035;}\n' +
'  float rr=sqrt(r2);\n' +
'  if(r2>1.){ float a=exp(-(rr-1.)*uR/18.); o=vec4(bg+vec3(.32,.55,1.)*a*.55,1.);return; }\n' +
'  float z=sqrt(1.-r2);\n' +
'  float sp=sin(uRot.y), cp=cos(uRot.y);\n' +
'  float lat=asin(clamp(z*sp+q.y*cp,-1.,1.));\n' +
'  float lon=uRot.x+atan(q.x, z*cp-q.y*sp);\n' +
'  vec2 uv=vec2(fract(lon/(2.*PI)+.5), .5-lat/PI);\n' +
'  vec2 dx=dFdx(uv), dy=dFdy(uv);\n' +
'  dx.x-=round(dx.x); dy.x-=round(dy.x);\n' +
'  vec3 c=textureGrad(uDay,uv,dx,dy).rgb;\n' +
'  vec2 ts=vec2(1.)/vec2(textureSize(uTopo,0));\n' +
'  vec2 gdx=dx*.5, gdy=dy*.5;\n' +
'  float hL=textureGrad(uTopo,uv-vec2(ts.x,0.),gdx,gdy).r, hR=textureGrad(uTopo,uv+vec2(ts.x,0.),gdx,gdy).r;\n' +
'  float hU=textureGrad(uTopo,uv-vec2(0.,ts.y),gdx,gdy).r, hD=textureGrad(uTopo,uv+vec2(0.,ts.y),gdx,gdy).r;\n' +
'  vec2 grad=vec2((hR-hL)/max(cos(lat),.15),(hD-hU));\n' +
'  float shade=clamp(1.-dot(grad,vec2(1.,1.))*5.,.55,1.45);\n' +
'  c*=shade;\n' +
'  vec3 n=vec3(q.x,q.y,z);\n' +
'  float lam=.62+.48*max(dot(n,normalize(vec3(-.45,.45,.77))),0.);\n' +
'  c*=lam;\n' +
'  c=pow(c,vec3(.92))*1.08;\n' +
'  float rim=pow(1.-z,2.2);\n' +
'  c=mix(c,vec3(.45,.68,1.),rim*.55);\n' +
'  float aa=clamp((1.-rr)*uR,0.,1.);\n' +
'  o=vec4(mix(bg+vec3(.32,.55,1.)*.55,c,aa),1.);\n' +
'}';
  var sh = function (t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(o)); return null; } return o; };
  var a = sh(gl.VERTEX_SHADER, vs), b = sh(gl.FRAGMENT_SHADER, fs); if (!a || !b) { gl = null; return false; }
  var pr = gl.createProgram(); gl.attachShader(pr, a); gl.attachShader(pr, b); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { gl = null; return false; }
  gl.useProgram(pr);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  ['uRes', 'uC', 'uR', 'uRot', 'uDpr', 'uT', 'uDay', 'uTopo'].forEach(function (n) { U[n] = gl.getUniformLocation(pr, n); });
  var aniso = gl.getExtension('EXT_texture_filter_anisotropic');
  var mk = function (unit) { var t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(unit ? [128, 128, 128, 255] : [13, 40, 80, 255])); return t; };
  var tDay = mk(0), tTopo = mk(1);
  var load = function (url, tex, unit, done) {
    var im = new Image(); im.onload = function () {
      gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im); gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
      if (done) done();
    };
    im.src = url;
  };
  // the small map shows instantly; the sharp one replaces it (skipped on phones to save data and memory)
  var sharp = !(coarse && Math.min(screen.width, screen.height) < 700);
  load('images/earth-2k.jpg', tDay, 0, sharp ? function () { load('images/earth-4k.jpg', tDay, 0); } : null);
  load('images/topo.png', tTopo, 1);
  return true;
}

function fit() {
  var r = stage.getBoundingClientRect(); W = r.width; H = r.height;
  dpr = Math.min(isMobile() ? 1.5 : 2, window.devicePixelRatio || 1);
  ov.width = cvGL.width = Math.round(W * dpr); ov.height = cvGL.height = Math.round(H * dpr);
}

/* where the globe sits: the free area beside the card (desktop) or above the sheet (phone) */
function layout() {
  var dock = $('#dock'), mob = isMobile(), L = lay;
  if (!mob) {
    var dw = dock.offsetWidth; L.right = S.open ? W - dw - 8 : W; L.top = 0;
    L.tcx = L.right / 2; L.tcy = H * 0.5;
    L.tbase = Math.min(L.right * 0.38, H * 0.4);
  } else {
    var nav = $('#top').offsetHeight + 14; L.nav = nav; var topH = nav + ($('#pop').classList.contains('show') ? 70 : 0), bot = S.open ? dock.offsetHeight : 110;
    L.right = W; L.top = topH;
    L.tcx = W / 2; L.tcy = (topH + (H - bot)) / 2;
    L.tbase = Math.min(W * 0.4, (H - bot - topH) * 0.42);
  }
  L.tbase = Math.round(Math.max(mob ? 90 : 140, L.tbase));
  if (L.cx == null) { L.cx = L.tcx; L.cy = L.tcy; L.base = L.tbase; }
}

function project(lon, lat) {
  var r = Math.PI / 180, l0 = g.lon * r, p0 = g.lat * r, l = lon * r, p = lat * r;
  var cosc = Math.sin(p0) * Math.sin(p) + Math.cos(p0) * Math.cos(p) * Math.cos(l - l0);
  var x = Math.cos(p) * Math.sin(l - l0), y = Math.cos(p0) * Math.sin(p) - Math.sin(p0) * Math.cos(p) * Math.cos(l - l0);
  return { x: lay.cx + x * lay.R, y: lay.cy - y * lay.R, vis: cosc };
}
function unproject(px, py) {
  var x = (px - lay.cx) / lay.R, y = -(py - lay.cy) / lay.R, r2 = x * x + y * y; if (r2 > 1) return null;
  var z = Math.sqrt(1 - r2), p0 = g.lat * Math.PI / 180, sp = Math.sin(p0), cp = Math.cos(p0);
  return [g.lon + Math.atan2(x, z * cp - y * sp) * 180 / Math.PI, Math.asin(z * sp + y * cp) * 180 / Math.PI];
}
function zoomBy(f, px, py) {
  var before = unproject(px, py);
  g.zoom = Math.max(1, Math.min(5, g.zoom * f)); g.target = null; g.idle = 0;
  lay.R = lay.base * g.zoom;
  var after = unproject(px, py);
  if (before && after) { g.lon += before[0] - after[0]; g.lat = Math.max(-85, Math.min(85, g.lat + before[1] - after[1])); }
}
function clickAt(x, y) {
  var L = LAYERS[S.i], best = -1, bd = 22;
  L.items.forEach(function (it, k) { if (!it.has) return; var p = project(it.lon, it.lat); if (p.vis > 0.05) { var d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = k; } } });
  if (best >= 0) selectItem(S.i, best); else if (S.sel >= 0) closePop();
}

function bindPointer() {
  var pts = new Map(), sx = 0, sy = 0, moved = 0, pinch = 0;
  ov.addEventListener('pointerdown', function (e) {
    pts.set(e.pointerId, [e.clientX, e.clientY]); ov.setPointerCapture(e.pointerId);
    if (pts.size === 2) { var v = Array.from(pts.values()); pinch = Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]); }
    g.drag = true; moved = 0; sx = e.clientX; sy = e.clientY; g.target = null; g.vx = g.vy = 0; ov.classList.add('drag');
