<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somnia Magna | Bringing dreams to life</title>
<meta name="description" content="Curated day and night experiences in Toronto.">
<meta property="og:title" content="Somnia Magna | Bringing dreams to life">
<meta property="og:description" content="Curated day and night experiences in Toronto, built around people and community.">
<meta property="og:image" content="og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0A0B1F">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#0A0B1F; --dusk:#1B1F4A; --pine:#0F2A22; --forest:#1F5A3A;
  --moon:#F3EFDF; --firefly:#7AF3C2; --lilac:#B9A6FF;
  --muted:rgba(243,239,223,.68); --line:rgba(243,239,223,.14);
  --serif:'Playfair Display',Georgia,serif; --display:'Anton','Bebas Neue',Impact,sans-serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--midnight)}
body{font-family:var(--sans);color:var(--moon);background:var(--midnight);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* header */
header.top{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .4s,backdrop-filter .4s}
header.top.solid{background:rgba(10,11,31,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;max-width:1280px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand b i{color:var(--firefly);font-style:normal}
.brand small{font-size:9.5px;letter-spacing:.32em;color:var(--muted);margin-top:6px}
nav.links{display:flex;gap:36px;font-size:12px;letter-spacing:.2em;font-weight:500}
nav.links a{opacity:.8;transition:opacity .2s,color .2s}
nav.links a:hover{opacity:1;color:var(--firefly)}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:12px 22px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:transform .2s,box-shadow .3s,background .3s,color .3s}
.pill svg{width:16px;height:16px}
.pill.ghost{border:1px solid var(--firefly);color:var(--firefly)}
.pill.ghost:hover{background:var(--firefly);color:var(--midnight)}
.pill.solid{background:var(--firefly);color:var(--midnight);box-shadow:0 0 40px -6px rgba(122,243,194,.65)}
.pill.solid:hover{transform:translateY(-2px);box-shadow:0 0 60px -4px rgba(122,243,194,.85)}
.pill.line{border:1px solid var(--line);color:var(--moon)}
.pill.line:hover{border-color:var(--moon)}

/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(120% 80% at 70% 10%, #20265c 0%, rgba(27,31,74,.4) 40%, transparent 70%), linear-gradient(180deg,#07081a 0%,#0d1033 55%,#162a3c 85%,#0F2A22 100%)}
#sky,#flies{position:absolute;inset:0;width:100%;height:100%;display:block}
#flies{z-index:4;pointer-events:none}
.moon{position:absolute;top:13%;right:14%;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#fffdf3,#efe8cf 55%,#d9d0b2 100%);
  box-shadow:0 0 60px 10px rgba(243,239,223,.25),0 0 180px 60px rgba(185,166,255,.12);z-index:1}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 60%,rgba(0,0,0,.07) 0 9%,transparent 10%),radial-gradient(circle at 35% 68%,rgba(0,0,0,.06) 0 6%,transparent 7%),radial-gradient(circle at 55% 30%,rgba(0,0,0,.05) 0 5%,transparent 6%)}
.ridge{position:absolute;left:0;right:0;bottom:0;width:100%;pointer-events:none}
.ridge svg{display:block;width:100%;height:100%}
.r1{height:46%;z-index:2}.r2{height:34%;z-index:3}.r3{height:24%;z-index:5}
.hero-copy{position:relative;z-index:6;text-align:center;padding:120px 24px 18vh}
.eyebrow{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--firefly);display:inline-flex;align-items:center;gap:12px}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:currentColor;opacity:.6}
.l1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(40px,6.4vw,84px);line-height:1;margin-top:26px;text-shadow:0 4px 40px rgba(0,0,0,.5)}
.l2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(96px,17vw,240px);line-height:.86;letter-spacing:.01em;margin-top:6px;
  background:linear-gradient(180deg,#fffdf4 30%,#cfc7ab 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 40px rgba(0,0,0,.45))}
.hero-sub{max-width:520px;margin:26px auto 0;color:var(--muted);font-size:17px}
.ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:7;font-size:10px;letter-spacing:.3em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-cue span{width:1px;height:38px;background:linear-gradient(var(--firefly),transparent);animation:cue 2.4s infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* sections */
.forest{background:linear-gradient(180deg,var(--pine) 0%,#0b1d1b 40%,var(--midnight) 100%)}
section{position:relative}
.pad{padding:130px 0}
.kicker{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--firefly);display:flex;align-items:center;gap:14px}
.kicker::before{content:"";width:28px;height:1px;background:currentColor}
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:70px;align-items:end}
.about h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(44px,5.6vw,78px);line-height:1.02;margin-top:22px}
.about p{color:var(--muted);font-size:18px;max-width:480px}
h2.big{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(52px,7vw,96px);line-height:.92;margin-top:20px}
h2.big em{font-family:var(--serif);font-style:italic;text-transform:none;color:var(--firefly);font-weight:400}

.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:64px}
.card{position:relative;border:1px solid var(--line);border-radius:22px;padding:38px 32px 40px;background:linear-gradient(180deg,rgba(27,31,74,.45),rgba(10,11,31,.35));overflow:hidden;transition:border-color .35s,transform .35s}
.card::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-120px;top:-120px;background:radial-gradient(circle,rgba(122,243,194,.18),transparent 65%);opacity:0;transition:opacity .4s}
.card:hover{border-color:rgba(122,243,194,.55);transform:translateY(-4px)}
.card:hover::before{opacity:1}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--firefly);background:rgba(122,243,194,.08);border:1px solid rgba(122,243,194,.25)}
.card .ic svg{width:24px;height:24px}
.card .n{font-size:12px;color:var(--muted);letter-spacing:.2em}
.card h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:40px;line-height:1;margin-top:34px}
.card .w{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--muted)}
.card p{margin-top:18px;color:var(--muted);font-size:15px}

.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:56px;border-top:1px solid var(--line)}
.pr{padding:34px 28px 10px 0;border-right:1px solid var(--line)}
.pr:last-child{border-right:0}
.pr+.pr{padding-left:28px}
.pr .s{color:var(--firefly);width:22px;height:22px;display:block}
.pr .s svg{width:22px;height:22px}
.pr h4{font-family:var(--serif);font-style:italic;font-weight:400;font-size:28px;margin-top:18px;line-height:1.15}
.pr p{color:var(--muted);margin-top:10px;font-size:15px}

.events{margin-top:48px;display:grid;gap:16px}
.ev{display:grid;grid-template-columns:200px 1fr auto;gap:30px;align-items:center;padding:30px 32px;border:1px solid var(--line);border-radius:20px;background:rgba(27,31,74,.3)}
.ev .d{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--firefly)}
.ev .pl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:6px}
.ev .pl svg{width:15px;height:15px}
.ev h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:32px;line-height:1}
.ev p{color:var(--muted);font-size:15px;margin-top:6px}
.ev a.go{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--firefly);transition:all .25s}
.ev a.go:hover{background:var(--firefly);color:var(--midnight)}
.ev a.go svg{width:20px}
.ev a.go:not([href]){display:none}

.partner{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;border:1px solid var(--line);border-radius:28px;padding:64px;
  background:radial-gradient(80% 120% at 100% 0%,rgba(122,243,194,.12),transparent 60%),radial-gradient(70% 100% at 0% 100%,rgba(185,166,255,.12),transparent 60%),rgba(15,42,34,.35)}
.partner p{color:var(--muted);font-size:17px;margin-top:22px;max-width:460px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--firefly);box-shadow:0 0 12px var(--firefly)}
.partner .right{display:flex;flex-direction:column;gap:28px;align-items:flex-start}

.contact{text-align:center;padding:160px 0 120px}
.contact .q{font-family:var(--serif);font-style:italic;font-size:clamp(30px,4vw,46px)}
.contact .m{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.contact h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(54px,8vw,110px);line-height:.92;margin-top:26px}
.contact p{color:var(--muted);margin-top:18px}
.contact .ctas{margin-top:38px}
.contact .addr{margin-top:22px;font-size:14px;color:var(--muted)}

footer{position:relative;padding:0 0 34px;color:var(--muted);font-size:12px;letter-spacing:.16em}
footer .trees{height:120px;display:block;width:100%}
footer .row{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--pine);padding:26px 24px 0;max-width:none}
footer .bg{background:var(--pine)}
footer a:hover{color:var(--firefly)}

.reveal{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

@media (max-width:900px){
  nav.links{display:none}
  .about,.partner{grid-template-columns:1fr;gap:30px}
  .partner{padding:40px 28px}
  .pillars,.principles{grid-template-columns:1fr}
  .pr{border-right:0;border-bottom:1px solid var(--line);padding:28px 0!important}
  .ev{grid-template-columns:1fr;gap:12px}
  .moon{width:64px;height:64px;right:9%;top:17%}
  .pad{padding:90px 0}
  .bar .pill{padding:10px 16px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // pine treeline generator
  function pines(w,h,count,minH,maxH,seed){
    var s=seed; function r(){s=(s*9301+49297)%233280;return s/233280}
    var d='M0 '+h+' ', x=-20;
    while(x<w+20){var th=minH+r()*(maxH-minH), tw=th*(.34+r()*.1), b=h-r()*6, tiers=3+Math.floor(r()*2);
      d+='L'+x.toFixed(1)+' '+b+' ';
      for(var t=0;t<tiers;t++){var f=t/tiers, nf=(t+1)/tiers, yb=b-th*f*0.92, yt=b-th*nf, half=tw*(1-f*.75)/2, cx=x+tw/2;
        d+='L'+(cx-half).toFixed(1)+' '+yb.toFixed(1)+' L'+(cx-half*.35).toFixed(1)+' '+(yt+th*.08).toFixed(1)+' ';}
      d+='L'+(x+tw/2).toFixed(1)+' '+(b-th).toFixed(1)+' ';
      for(var t2=tiers-1;t2>=0;t2--){var f2=t2/tiers, nf2=(t2+1)/tiers, yb2=b-th*f2*0.92, yt2=b-th*nf2, half2=tw*(1-f2*.75)/2, cx2=x+tw/2;
        d+='L'+(cx2+half2*.35).toFixed(1)+' '+(yt2+th*.08).toFixed(1)+' L'+(cx2+half2).toFixed(1)+' '+yb2.toFixed(1)+' ';}
      d+='L'+(x+tw).toFixed(1)+' '+b+' '; x+=tw*(.5+r()*.45);}
    return d+'L'+w+' '+h+' Z';
  }
  document.querySelector('#treeline path').setAttribute('d', pines(1440,220,0,90,200,11));
  document.querySelector('#foottrees path').setAttribute('d', pines(1440,120,0,40,110,5));

  // stars
  var sky=document.getElementById('sky'), sc=sky.getContext('2d'), stars=[], W,H,dpr;
  var fl=document.getElementById('flies'), fc=fl.getContext('2d'), flies=[];
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=sky.clientWidth;H=sky.clientHeight;[sky,fl].forEach(function(c){c.width=W*dpr;c.height=H*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)});
    stars=[];var n=Math.round(W*H/2600);for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.75,r:Math.random()<.08?1.6:Math.random()*1.1+.3,p:Math.random()*6.28,s:.5+Math.random()*1.5});

    if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W*.7+W*.1,y:Math.random()*H*.3,l:0};
    if(shoot){shoot.l+=14;var g=sc.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.l,shoot.y-shoot.l*.35);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');sc.globalAlpha=1;sc.strokeStyle=g;sc.lineWidth=1.4;sc.beginPath();sc.moveTo(shoot.x+shoot.l*.2,shoot.y+shoot.l*.07);sc.lineTo(shoot.x-shoot.l*.6,shoot.y-shoot.l*.21);sc.stroke();shoot.x+=10;shoot.y+=3.5;if(shoot.l>220)shoot=null;}
    sc.globalAlpha=1;
    fc.clearRect(0,0,W,H);
    for(var k=0;k<flies.length;k++){var f=flies[k];f.x+=f.vx+Math.sin(t/1600+f.p)*.25;f.y+=f.vy+Math.cos(t/1900+f.p)*.18;if(f.x<-10)f.x=W+10;if(f.x>W+10)f.x=-10;if(f.y<H*.55)f.vy=Math.abs(f.vy);if(f.y>H)f.vy=-Math.abs(f.vy);
      var b=.25+.75*Math.max(0,Math.sin(t/700+f.p*3));var gr=fc.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*7);gr.addColorStop(0,'rgba(122,243,194,'+(.9*b)+')');gr.addColorStop(.25,'rgba(122,243,194,'+(.35*b)+')');gr.addColorStop(1,'rgba(122,243,194,0)');fc.fillStyle=gr;fc.beginPath();fc.arc(f.x,f.y,f.r*7,0,6.28);fc.fill();}
